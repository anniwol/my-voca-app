<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>모바일 단어장</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f7ff',
                            100: '#e0effe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Touch and interaction optimizations */
        * {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        input, textarea {
            user-select: text;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.5);
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 min-h-screen font-sans flex flex-col transition-colors duration-200">

    <!-- Header Component -->
    <header class="sticky top-0 z-30 bg-white/90 dark:bg-gray-800/90 backdrop-blur-md border-b border-gray-200 dark:border-gray-700 px-4 py-3 flex justify-between items-center h-14">
        <!-- Back Button (Hidden on Home) -->
        <button id="back-btn" onclick="showSection('home')" class="hidden flex items-center justify-center w-9 h-9 rounded-full bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-200 active:scale-95 transition">
            <i class="fa-solid fa-arrow-left text-base"></i>
        </button>
        <div id="header-title" class="font-bold text-lg text-gray-800 dark:text-white">단어장 앱</div>
        
        <!-- Dark Mode Toggle Button -->
        <button id="theme-toggle" onclick="toggleDarkMode()" class="flex items-center justify-center w-9 h-9 rounded-full bg-gray-100 dark:bg-gray-700 text-yellow-500 dark:text-yellow-300 active:scale-95 transition">
            <i id="theme-icon" class="fa-solid fa-moon text-base"></i>
        </button>
    </header>

    <!-- App Content Area -->
    <main class="flex-1 flex flex-col max-w-md w-full mx-auto p-4 overflow-x-hidden">

        <!-- [HOME SECTION] -->
        <section id="section-home" class="flex-1 flex flex-col justify-center space-y-4 py-6">
            <div class="text-center mb-6">
                <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-100 dark:bg-blue-900/40 text-blue-600 dark:text-blue-400 rounded-2xl mb-3 shadow-inner">
                    <i class="fa-solid fa-book-bookmark text-3xl"></i>
                </div>
                <h1 class="text-2xl font-extrabold text-gray-900 dark:text-white">나만의 단어장</h1>
                <p class="text-xs text-gray-500 dark:text-gray-400 mt-1" id="total-words-count">총 0개의 단어가 저장되어 있습니다.</p>
            </div>

            <!-- Card Buttons -->
            <button onclick="showSection('learn')" class="flex items-center p-4 bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 active:scale-[0.98] transition">
                <div class="w-12 h-12 rounded-xl bg-indigo-50 dark:bg-indigo-900/30 text-indigo-500 flex items-center justify-center text-xl mr-4">
                    <i class="fa-solid fa-shuffle"></i>
                </div>
                <div class="text-left">
                    <h2 class="font-bold text-gray-800 dark:text-white">랜덤 단어 학습</h2>
                    <p class="text-xs text-gray-500 dark:text-gray-400">터치하여 단어와 뜻을 암기합니다.</p>
                </div>
            </button>

            <button onclick="showSection('add')" class="flex items-center p-4 bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 active:scale-[0.98] transition">
                <div class="w-12 h-12 rounded-xl bg-emerald-50 dark:bg-emerald-900/30 text-emerald-500 flex items-center justify-center text-xl mr-4">
                    <i class="fa-solid fa-plus"></i>
                </div>
                <div class="text-left">
                    <h2 class="font-bold text-gray-800 dark:text-white">단어 추가 및 저장</h2>
                    <p class="text-xs text-gray-500 dark:text-gray-400">새 단어 또는 대량 단어를 등록합니다.</p>
                </div>
            </button>

            <button onclick="showSection('list')" class="flex items-center p-4 bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 active:scale-[0.98] transition">
                <div class="w-12 h-12 rounded-xl bg-amber-50 dark:bg-amber-900/30 text-amber-500 flex items-center justify-center text-xl mr-4">
                    <i class="fa-solid fa-list-check"></i>
                </div>
                <div class="text-left">
                    <h2 class="font-bold text-gray-800 dark:text-white">단어 목록 및 편집</h2>
                    <p class="text-xs text-gray-500 dark:text-gray-400">알파벳순 조회, 검색 및 수정/삭제</p>
                </div>
            </button>
        </section>

        <!-- [SECTION 1: LEARN] -->
        <section id="section-learn" class="hidden flex-1 flex flex-col justify-between py-4 select-none cursor-pointer" onclick="handleLearnTouch()">
            <div class="text-center text-xs text-gray-400 dark:text-gray-500 font-medium">
                화면 아무 데나 터치하세요
            </div>

            <!-- Card View Area -->
            <div class="my-auto min-h-[300px] flex flex-col items-center justify-center p-6 bg-white dark:bg-gray-800 rounded-3xl shadow-md border border-gray-100 dark:border-gray-700 text-center relative overflow-hidden transition-all duration-300">
                <div id="learn-word" class="text-3xl md:text-4xl font-extrabold text-gray-900 dark:text-white break-words w-full">
                    -
                </div>
                <div id="learn-meaning" class="text-xl md:text-2xl font-medium text-blue-600 dark:text-blue-400 mt-6 break-words w-full transition-opacity duration-200 opacity-0 min-h-[2rem]">
                    -
                </div>
            </div>

            <!-- Touch Hint -->
            <div class="text-center">
                <span id="learn-hint" class="inline-block px-4 py-2 bg-gray-200 dark:bg-gray-800 text-gray-600 dark:text-gray-300 text-xs rounded-full font-medium">
                    터치하여 뜻 보기
                </span>
            </div>
        </section>

        <!-- [SECTION 2: ADD WORDS] -->
        <section id="section-add" class="hidden flex-1 flex flex-col space-y-6 py-2">
            <!-- Tabs -->
            <div class="flex bg-gray-200 dark:bg-gray-800 p-1 rounded-xl">
                <button id="tab-single-btn" onclick="switchAddTab('single')" class="flex-1 py-2 text-xs font-bold rounded-lg bg-white dark:bg-gray-700 text-blue-600 dark:text-white shadow-sm transition">개별 추가</button>
                <button id="tab-bulk-btn" onclick="switchAddTab('bulk')" class="flex-1 py-2 text-xs font-bold rounded-lg text-gray-600 dark:text-gray-400 transition">대량 추가</button>
            </div>

            <!-- Single Add Form -->
            <form id="single-form" onsubmit="handleAddSingle(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 dark:text-gray-400 mb-1">영단어</label>
                    <input type="text" id="input-word" required placeholder="예: apple" class="w-full px-4 py-3 bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 dark:text-white">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 dark:text-gray-400 mb-1">뜻</label>
                    <input type="text" id="input-meaning" required placeholder="예: 사과" class="w-full px-4 py-3 bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 dark:text-white">
                </div>
                <button type="submit" class="w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-md active:scale-[0.98] transition">
                    저장하기
                </button>
            </form>

            <!-- Bulk Add Form -->
            <form id="bulk-form" onsubmit="handleAddBulk(event)" class="hidden space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 dark:text-gray-400 mb-1">단어 및 뜻 일괄 입력 (줄바꿈 구분)</label>
                    <textarea id="input-bulk" rows="8" placeholder="형식 예시:&#10;apple - 사과&#10;banana, 바나나&#10;cat : 고양이" class="w-full px-4 py-3 bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 dark:text-white text-sm font-mono"></textarea>
                    <p class="text-[11px] text-gray-400 mt-1">구분 기호( - , : )를 기준으로 단어와 뜻을 자동으로 분리합니다.</p>
                </div>
                <button type="submit" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-md active:scale-[0.98] transition">
                    일괄 저장하기
                </button>
            </form>
        </section>

        <!-- [SECTION 3: LIST & SEARCH & EDIT] -->
        <section id="section-list" class="hidden flex-1 flex flex-col">
            <!-- Sticky Search Header with correct offset and background padding -->
            <div class="sticky top-14 z-20 bg-gray-50 dark:bg-gray-900 pt-1 pb-3">
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
                    <input type="text" id="search-input" oninput="renderWordList()" placeholder="단어 또는 뜻 검색..." class="w-full pl-10 pr-10 py-2.5 bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 dark:text-white shadow-sm">
                    <button id="search-clear" onclick="clearSearch()" class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 dark:hover:text-gray-200">
                        <i class="fa-solid fa-xmark text-base"></i>
                    </button>
                </div>
            </div>

            <!-- Word List Container with pt-2 to prevent top item cutout -->
            <div id="word-list" class="flex-1 space-y-2 pt-1 pb-6">
                <!-- Dynamically rendered word cards -->
            </div>
        </section>

    </main>

    <!-- Edit Modal -->
    <div id="edit-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm">
        <div class="bg-white dark:bg-gray-800 w-full max-w-sm rounded-2xl p-5 shadow-2xl space-y-4 transform transition-all">
            <h3 class="font-bold text-lg text-gray-900 dark:text-white">단어 수정</h3>
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">영단어</label>
                    <input type="text" id="edit-word-input" class="w-full px-3 py-2 bg-gray-100 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg text-sm dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">뜻</label>
                    <input type="text" id="edit-meaning-input" class="w-full px-3 py-2 bg-gray-100 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg text-sm dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
            </div>
            <div class="flex justify-between items-center pt-2">
                <button onclick="deleteWordFromModal()" class="px-3 py-2 text-xs font-semibold text-red-600 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-950/40 rounded-lg transition">
                    <i class="fa-regular fa-trash-can mr-1"></i> 삭제
                </button>
                <div class="flex space-x-2">
                    <button onclick="closeEditModal()" class="px-4 py-2 text-xs font-semibold text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg transition">취소</button>
                    <button onclick="saveEditModal()" class="px-4 py-2 text-xs font-semibold text-white bg-blue-600 hover:bg-blue-700 rounded-lg transition">저장</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Initial Default Vocabulary
        const DEFAULT_WORDS = [
            { id: '1', word: 'apple', meaning: '사과' },
            { id: '2', word: 'banana', meaning: '바나나' },
            { id: '3', word: 'meticulous', meaning: '꼼꼼한, 세심한' },
            { id: '4', word: 'persistent', meaning: '끈질긴, 집요한' },
            { id: '5', word: 'reluctant', meaning: '꺼리는, 마지못해 하는' }
        ];

        // App State Variables
        let words = [];
        let currentSection = 'home';
        let learnState = 0; // 0: Word shown, 1: Meaning shown
        let currentLearnIndex = -1;
        let editingWordId = null;

        // On Load Initializer
        window.onload = function() {
            loadWords();
            initTheme();
            updateHomeStats();
        };

        // LocalStorage Management
        function loadWords() {
            const saved = localStorage.getItem('vocab_words');
            if (saved) {
                try {
                    words = JSON.parse(saved);
                } catch (e) {
                    words = [...DEFAULT_WORDS];
                }
            } else {
                words = [...DEFAULT_WORDS];
                saveWords();
            }
        }

        function saveWords() {
            localStorage.setItem('vocab_words', JSON.stringify(words));
            updateHomeStats();
        }

        function updateHomeStats() {
            document.getElementById('total-words-count').textContent = `총 ${words.length}개의 단어가 저장되어 있습니다.`;
        }

        // Navigation Management
        function showSection(sectionId) {
            currentSection = sectionId;
            
            // Hide all sections
            document.getElementById('section-home').classList.add('hidden');
            document.getElementById('section-learn').classList.add('hidden');
            document.getElementById('section-add').classList.add('hidden');
            document.getElementById('section-list').classList.add('hidden');

            // Show selected section
            document.getElementById(`section-${sectionId}`).classList.remove('hidden');

            // Header UI Updates
            const backBtn = document.getElementById('back-btn');
            const headerTitle = document.getElementById('header-title');

            if (sectionId === 'home') {
                backBtn.classList.add('hidden');
                headerTitle.textContent = '단어장 앱';
            } else {
                backBtn.classList.remove('hidden');
                if (sectionId === 'learn') {
                    headerTitle.textContent = '랜덤 단어 학습';
                    initLearnSection();
                } else if (sectionId === 'add') {
                    headerTitle.textContent = '단어 추가';
                } else if (sectionId === 'list') {
                    headerTitle.textContent = '단어 목록 및 편집';
                    renderWordList();
                }
            }
        }

        // [SECTION 1: LEARN LOGIC]
        function initLearnSection() {
            if (words.length === 0) {
                document.getElementById('learn-word').textContent = '단어가 없습니다';
                document.getElementById('learn-meaning').textContent = '단어를 추가해주세요';
                document.getElementById('learn-meaning').classList.remove('opacity-0');
                document.getElementById('learn-hint').textContent = '메인 화면으로 돌아가기';
                learnState = -1;
                return;
            }
            nextLearnWord();
        }

        function nextLearnWord() {
            let randomIndex;
            if (words.length > 1) {
                do {
                    randomIndex = Math.floor(Math.random() * words.length);
                } while (randomIndex === currentLearnIndex);
            } else {
                randomIndex = 0;
            }

            currentLearnIndex = randomIndex;
            const currentItem = words[currentLearnIndex];

            document.getElementById('learn-word').textContent = currentItem.word;
            document.getElementById('learn-meaning').textContent = currentItem.meaning;
            document.getElementById('learn-meaning').classList.add('opacity-0');
            document.getElementById('learn-hint').textContent = '터치하여 뜻 보기';
            learnState = 0; // 0: Word Displayed
        }

        function handleLearnTouch() {
            if (words.length === 0) return;

            if (learnState === 0) {
                // Show Meaning
                document.getElementById('learn-meaning').classList.remove('opacity-0');
                document.getElementById('learn-hint').textContent = '터치하여 다음 단어 보기';
                learnState = 1;
            } else if (learnState === 1) {
                // Next Word
                nextLearnWord();
            }
        }

        // [SECTION 2: ADD LOGIC]
        function switchAddTab(tab) {
            const singleBtn = document.getElementById('tab-single-btn');
            const bulkBtn = document.getElementById('tab-bulk-btn');
            const singleForm = document.getElementById('single-form');
            const bulkForm = document.getElementById('bulk-form');

            if (tab === 'single') {
                singleBtn.className = "flex-1 py-2 text-xs font-bold rounded-lg bg-white dark:bg-gray-700 text-blue-600 dark:text-white shadow-sm transition";
                bulkBtn.className = "flex-1 py-2 text-xs font-bold rounded-lg text-gray-600 dark:text-gray-400 transition";
                singleForm.classList.remove('hidden');
                bulkForm.classList.add('hidden');
            } else {
                bulkBtn.className = "flex-1 py-2 text-xs font-bold rounded-lg bg-white dark:bg-gray-700 text-blue-600 dark:text-white shadow-sm transition";
                singleBtn.className = "flex-1 py-2 text-xs font-bold rounded-lg text-gray-600 dark:text-gray-400 transition";
                bulkForm.classList.remove('hidden');
                singleForm.classList.add('hidden');
            }
        }

        function handleAddSingle(e) {
            e.preventDefault();
            const wordInput = document.getElementById('input-word');
            const meaningInput = document.getElementById('input-meaning');

            const word = wordInput.value.trim();
            const meaning = meaningInput.value.trim();

            if (word && meaning) {
                words.push({
                    id: Date.now().toString(),
                    word: word,
                    meaning: meaning
                });
                saveWords();
                wordInput.value = '';
                meaningInput.value = '';
                showToast('단어가 추가되었습니다.');
            }
        }

        function handleAddBulk(e) {
            e.preventDefault();
            const bulkText = document.getElementById('input-bulk').value.trim();
            if (!bulkText) return;

            const lines = bulkText.split('\n');
            let addedCount = 0;

            lines.forEach(line => {
                if (!line.trim()) return;
                // Splitting by '-', ',', or ':'
                const parts = line.split(/[-,:]/);
                if (parts.length >= 2) {
                    const word = parts[0].trim();
                    const meaning = parts.slice(1).join(' ').trim();
                    if (word && meaning) {
                        words.push({
                            id: (Date.now() + Math.random()).toString(),
                            word: word,
                            meaning: meaning
                        });
                        addedCount++;
                    }
                }
            });

            if (addedCount > 0) {
                saveWords();
                document.getElementById('input-bulk').value = '';
                showToast(`${addedCount}개 단어가 일괄 추가되었습니다.`);
            } else {
                showToast('구분자(-, 또는 :)를 사용해 단어와 뜻을 적어주세요.');
            }
        }

        // [SECTION 3: LIST & SEARCH & EDIT LOGIC]
        function renderWordList() {
            const searchInput = document.getElementById('search-input');
            const clearBtn = document.getElementById('search-clear');
            const query = searchInput.value.toLowerCase().trim();
            const listContainer = document.getElementById('word-list');

            // Toggle clear button
            if (query) {
                clearBtn.classList.remove('hidden');
            } else {
                clearBtn.classList.add('hidden');
            }

            // Alphabetical Sort
            const sortedWords = [...words].sort((a, b) => a.word.localeCompare(b.word, 'en', { sensitivity: 'base' }));

            // Filter Query
            const filteredWords = sortedWords.filter(item => 
                item.word.toLowerCase().includes(query) || item.meaning.toLowerCase().includes(query)
            );

            listContainer.innerHTML = '';

            if (filteredWords.length === 0) {
                listContainer.innerHTML = `
                    <div class="text-center py-12 text-gray-400 dark:text-gray-500">
                        <i class="fa-regular fa-folder-open text-3xl mb-2"></i>
                        <p class="text-xs">검색 결과가 없거나 단어가 비어있습니다.</p>
                    </div>
                `;
                return;
            }

            filteredWords.forEach(item => {
                const card = document.createElement('div');
                card.className = "flex items-center justify-between p-4 bg-white dark:bg-gray-800 rounded-xl border border-gray-100 dark:border-gray-700 shadow-sm active:scale-[0.99] transition cursor-pointer";
                card.onclick = () => openEditModal(item.id);

                card.innerHTML = `
                    <div class="flex-1 pr-3">
                        <div class="font-bold text-gray-900 dark:text-white break-words">${escapeHtml(item.word)}</div>
                        <div class="text-sm text-blue-600 dark:text-blue-400 mt-0.5 break-words">${escapeHtml(item.meaning)}</div>
                    </div>
                    <i class="fa-solid fa-chevron-right text-xs text-gray-300 dark:text-gray-600"></i>
                `;
                listContainer.appendChild(card);
            });
        }

        function clearSearch() {
            document.getElementById('search-input').value = '';
            renderWordList();
        }

        // Modal Operations
        function openEditModal(id) {
            const item = words.find(w => w.id === id);
            if (!item) return;

            editingWordId = id;
            document.getElementById('edit-word-input').value = item.word;
            document.getElementById('edit-meaning-input').value = item.meaning;
            document.getElementById('edit-modal').classList.remove('hidden');
        }

        function closeEditModal() {
            editingWordId = null;
            document.getElementById('edit-modal').classList.add('hidden');
        }

        function saveEditModal() {
            if (!editingWordId) return;

            const newWord = document.getElementById('edit-word-input').value.trim();
            const newMeaning = document.getElementById('edit-meaning-input').value.trim();

            if (!newWord || !newMeaning) {
                showToast('영단어와 뜻을 모두 입력해주세요.');
                return;
            }

            const target = words.find(w => w.id === editingWordId);
            if (target) {
                target.word = newWord;
                target.meaning = newMeaning;
                saveWords();
                renderWordList();
                closeEditModal();
                showToast('수정 완료되었습니다.');
            }
        }

        function deleteWordFromModal() {
            if (!editingWordId) return;

            words = words.filter(w => w.id !== editingWordId);
            saveWords();
            renderWordList();
            closeEditModal();
            showToast('단어가 삭제되었습니다.');
        }

        // Dark Mode Controller
        function initTheme() {
            const isDark = localStorage.getItem('vocab_dark_mode') === 'true' || 
                (!('vocab_dark_mode' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches);
            
            if (isDark) {
                document.documentElement.classList.add('dark');
                document.getElementById('theme-icon').className = 'fa-solid fa-sun text-base';
            } else {
                document.documentElement.classList.remove('dark');
                document.getElementById('theme-icon').className = 'fa-solid fa-moon text-base';
            }
        }

        function toggleDarkMode() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('vocab_dark_mode', isDark);
            document.getElementById('theme-icon').className = isDark ? 'fa-solid fa-sun text-base' : 'fa-solid fa-moon text-base';
        }

        // Simple Toast Message Container
        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'fixed bottom-6 left-1/2 -translate-x-1/2 bg-gray-900/90 dark:bg-white/90 text-white dark:text-gray-900 text-xs font-semibold px-4 py-2.5 rounded-full shadow-lg z-50 transition-all duration-300 pointer-events-none opacity-0 transform translate-y-2';
            toast.textContent = message;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.classList.remove('opacity-0', 'translate-y-2');
            }, 10);

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 2000);
        }

        // HTML Escape Helper
        function escapeHtml(str) {
            return str.replace(/[&<>"']/g, function(m) {
                return {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#039;'
                }[m];
            });
        }
    </script>
</body>
</html>
