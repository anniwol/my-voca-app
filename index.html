<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>단어장 앱</title>
  <style>
    :root {
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --text-color: #212529;
      --text-sub: #6c757d;
      --accent-color: #0d6efd;
      --border-color: #e9ecef;
      --input-bg: #ffffff;
      --shadow-color: rgba(0, 0, 0, 0.05);
      --progress-bg: #e9ecef;
    }
    [data-theme="dark"] {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-color: #f8f9fa;
      --text-sub: #adb5bd;
      --accent-color: #3d8bfd;
      --border-color: #2c2c2c;
      --input-bg: #2a2a2a;
      --shadow-color: rgba(0, 0, 0, 0.3);
      --progress-bg: #333333;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .app-header {
      height: 56px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid var(--border-color); background-color: var(--bg-color); z-index: 100; flex-shrink: 0;
    }
    .header-btn { background: none; border: none; color: var(--text-color); font-size: 1.2rem; cursor: pointer; padding: 8px; display: flex; align-items: center; justify-content: center; }
    .header-title { font-size: 1.1rem; font-weight: 600; }

    .theme-toggle { display: flex; align-items: center; cursor: pointer; }
    .theme-toggle input { display: none; }
    .toggle-slider { width: 44px; height: 24px; background-color: #ccc; border-radius: 12px; position: relative; transition: 0.3s; flex-shrink: 0; }
    .toggle-slider::before { content: ""; position: absolute; width: 18px; height: 18px; border-radius: 50%; background-color: white; top: 3px; left: 3px; transition: 0.3s; }
    input:checked + .toggle-slider { background-color: var(--accent-color); }
    input:checked + .toggle-slider::before { transform: translateX(20px); }

    .content-area { flex: 1; position: relative; overflow: hidden; }
    .section { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; flex-direction: column; }
    .section.active { display: flex; }

    .home-container { padding: 24px 16px; display: flex; flex-direction: column; gap: 16px; max-width: 500px; margin: 0 auto; width: 100%; height: 100%; justify-content: center; }
    .menu-card { background-color: var(--card-bg); padding: 24px 20px; border-radius: 16px; border: 1px solid var(--border-color); box-shadow: 0 4px 12px var(--shadow-color); cursor: pointer; transition: transform 0.1s; display: flex; flex-direction: column; gap: 8px; }
    .menu-card:active { transform: scale(0.98); }
    .menu-card h2 { font-size: 1.25rem; color: var(--accent-color); }
    .menu-card p { font-size: 0.9rem; color: var(--text-sub); }

    .sub-container { padding: 20px 16px; overflow-y: auto; max-width: 500px; margin: 0 auto; width: 100%; flex: 1; }

    /* 탭 헤더 (공간별 / 태그별) */
    .tab-header { display: flex; border-bottom: 1px solid var(--border-color); margin-bottom: 12px; }
    .tab-btn { flex: 1; padding: 12px; text-align: center; font-weight: 600; font-size: 0.95rem; color: var(--text-sub); cursor: pointer; border-bottom: 2px solid transparent; }
    .tab-btn.active { color: var(--accent-color); border-bottom-color: var(--accent-color); }

    /* 학습 공간/태그 선택 카드 */
    .study-select-container { display: flex; flex-direction: column; overflow: hidden; padding-bottom: max(16px, env(safe-area-inset-bottom)); }
    .space-select-list { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; margin-top: 4px; overflow-y: auto; padding-right: 2px; }
    
    .space-card-item {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 16px 18px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 2px 6px var(--shadow-color);
    }
    .space-card-header { display: flex; align-items: center; gap: 10px; justify-content: space-between; }
    .space-card-title { font-size: 1.05rem; font-weight: 600; display: flex; align-items: center; gap: 8px; }
    .space-card-title input { width: 18px; height: 18px; accent-color: var(--accent-color); }
    .space-card-meta { font-size: 0.85rem; color: var(--text-sub); margin-left: 26px; }
    
    .progress-box { margin-top: 4px; }
    .progress-info { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--text-sub); margin-bottom: 4px; }
    .progress-bar-bg { width: 100%; height: 6px; background-color: var(--progress-bg); border-radius: 3px; overflow: hidden; }
    .progress-bar-fill { height: 100%; background-color: var(--accent-color); width: 0%; transition: width 0.3s; }

    .bottom-action-bar { margin-top: 12px; flex-shrink: 0; display: flex; gap: 8px; }
    .btn-action-left { flex: 1; padding: 14px; border-radius: 10px; border: 1px solid var(--border-color); background-color: var(--card-bg); color: #dc3545; font-size: 0.85rem; font-weight: 600; cursor: pointer; white-space: nowrap; }
    .btn-action-left:disabled { opacity: 0.4; cursor: not-allowed; color: var(--text-sub); }
    .btn-action-right { flex: 1; padding: 14px; border-radius: 10px; border: none; background-color: var(--accent-color); color: white; font-size: 0.85rem; font-weight: 600; cursor: pointer; white-space: nowrap; }
    .btn-action-right:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-action-mid { flex: 1; padding: 14px; border-radius: 10px; border: 1px solid var(--accent-color); background-color: var(--card-bg); color: var(--accent-color); font-size: 0.85rem; font-weight: 600; cursor: pointer; white-space: nowrap; }
    .btn-action-mid:disabled { opacity: 0.4; cursor: not-allowed; }

    /* 단어 학습 진행 화면 */
    .study-container { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; text-align: center; cursor: pointer; position: relative; }
    
    .study-progress-top {
      position: absolute; top: 12px; left: 16px; right: 16px;
      display: flex; flex-direction: column; gap: 6px;
    }
    .study-progress-text { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--text-sub); font-weight: 500; }
    
    .study-card {
      background: none;
      border: none;
      box-shadow: none;
      padding: 0;
      width: 100%;
      max-width: 420px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .word-display { font-size: 2.8rem; font-weight: 700; word-break: break-word; color: var(--text-color); margin-bottom: 16px; }

    .meaning-display { font-size: 1.8rem; color: var(--accent-color); min-height: 2.5rem; visibility: hidden; word-break: break-word; font-weight: 500; margin-bottom: 16px; }
    .meaning-display.visible { visibility: visible; }

    .tag-badge-group { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin-top: 8px; }
    .tag-badge { font-size: 0.9rem; background-color: rgba(13, 110, 253, 0.1); color: var(--accent-color); padding: 4px 12px; border-radius: 12px; }

    /* 하단 제어 요소 (수정 버튼 / 복습 필요 토글 확장) */
    .btn-edit-in-study {
      position: absolute;
      bottom: 60px;
      left: 20px;
      padding: 10px 18px;
      border-radius: 24px;
      border: 1px solid var(--border-color);
      background-color: var(--card-bg);
      color: var(--text-color);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 3px 8px var(--shadow-color);
    }

    .review-check { position: absolute; bottom: 60px; right: 20px; display: none; align-items: center; gap: 12px; font-size: 1.1rem; font-weight: 600; cursor: pointer; }
    .review-check.visible { display: flex; }
    .review-check input { display: none; }
    .review-slider { width: 62px; height: 34px; background-color: #ccc; border-radius: 17px; position: relative; transition: 0.3s; flex-shrink: 0; }
    .review-slider::before { content: ""; position: absolute; width: 28px; height: 28px; border-radius: 50%; background-color: white; top: 3px; left: 3px; transition: 0.3s; }
    .review-check input:checked + .review-slider { background-color: var(--accent-color); }
    .review-check input:checked + .review-slider::before { transform: translateX(28px); }
    
    .study-hint { position: absolute; bottom: 18px; font-size: 0.85rem; color: var(--text-sub); }

    /* 폼 요소 및 모달 */
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 8px; color: var(--text-sub); }
    .form-input, .form-textarea, .form-select { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border-color); background-color: var(--input-bg); color: var(--text-color); font-size: 0.95rem; outline: none; user-select: text; }
    .form-textarea { height: 90px; resize: none; }
    .btn-primary { width: 100%; padding: 12px; border-radius: 10px; border: none; background-color: var(--accent-color); color: white; font-size: 0.95rem; font-weight: 600; cursor: pointer; }
    .space-manage-box { display: flex; gap: 8px; }
    .accordion-toggle { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 10px; font-size: 0.9rem; font-weight: 600; cursor: pointer; margin: 12px 0; }
    .accordion-content { display: none; padding-bottom: 12px; }
    .accordion-content.open { display: block; }
    .divider { text-align: center; margin: 24px 0 16px 0; position: relative; }
    .divider::before { content: ""; position: absolute; top: 50%; left: 0; width: 100%; height: 1px; background-color: var(--border-color); z-index: 1; }
    .divider span { position: relative; z-index: 2; background-color: var(--bg-color); padding: 0 12px; font-size: 0.85rem; color: var(--text-sub); }

    .list-header-area { padding: 12px 16px; background-color: var(--bg-color); border-bottom: 1px solid var(--border-color); flex-shrink: 0; }
    .search-input { width: 100%; padding: 12px 16px; border-radius: 10px; border: 1px solid var(--border-color); background-color: var(--input-bg); color: var(--text-color); font-size: 0.95rem; outline: none; user-select: text; }
    .word-list-scroll { flex: 1; overflow-y: auto; padding: 16px; }
    .list-container { max-width: 500px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; padding-bottom: 40px; }

    .folder-card { background-color: rgba(13, 110, 253, 0.08); border: 1.5px solid var(--accent-color); border-radius: 12px; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; margin-bottom: 6px; }
    .folder-card-title { font-size: 0.95rem; font-weight: 700; color: var(--accent-color); display: flex; align-items: center; gap: 8px; }
    .folder-card-count { font-size: 0.8rem; font-weight: 600; color: var(--accent-color); background-color: rgba(13, 110, 253, 0.15); padding: 2px 8px; border-radius: 12px; }

    .word-item { background-color: var(--card-bg); padding: 14px 16px; border-radius: 12px; border: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
    .word-item-info { display: flex; flex-direction: column; gap: 4px; user-select: text; }
    .word-item-eng { font-size: 1.05rem; font-weight: 600; }
    .word-item-kor { font-size: 0.9rem; color: var(--text-sub); }
    .word-item-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; font-size: 0.8rem; }
    .word-review-badge { color: var(--accent-color); font-weight: 600; }
    .word-space-badge { background-color: var(--border-color); color: var(--text-sub); padding: 2px 6px; border-radius: 6px; }
    .empty-msg { text-align: center; color: var(--text-sub); padding: 40px 0; font-size: 0.95rem; }

    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.5); display: none; justify-content: center; align-items: center; z-index: 200; padding: 20px; }
    .modal-overlay.active { display: flex; }
    .modal-box { background-color: var(--card-bg); border-radius: 16px; width: 100%; max-width: 400px; padding: 20px; display: flex; flex-direction: column; gap: 14px; max-height: 85vh; overflow-y: auto; }
    .modal-title { font-size: 1.1rem; font-weight: 600; }
    .modal-btns { display: flex; gap: 8px; }
    .btn-secondary { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); background: none; color: var(--text-color); font-weight: 600; cursor: pointer; }
    .btn-danger { flex: 1; padding: 12px; border-radius: 8px; border: none; background-color: #dc3545; color: white; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>

  <header class="app-header">
    <button class="header-btn" id="backBtn" style="visibility: hidden;">&#x2190;</button>
    <div class="header-title" id="headerTitle">단어장</div>
    <label class="theme-toggle">
      <input type="checkbox" id="themeSwitch">
      <span class="toggle-slider"></span>
    </label>
  </header>

  <main class="content-area">

    <!-- 메인 홈 -->
    <section id="sec-home" class="section active">
      <div class="home-container">
        <div class="menu-card" onclick="navTo('study-select')">
          <h2>랜덤 단어 학습</h2>
          <p>저장 공간 및 태그별로 단어를 학습합니다.</p>
        </div>
        <div class="menu-card" onclick="navTo('add')">
          <h2>단어 저장 및 공간 관리</h2>
          <p>공간을 선택하여 단어를 추가하거나 공간을 편집합니다.</p>
        </div>
        <div class="menu-card" onclick="navTo('list')">
          <h2>저장 단어 확인</h2>
          <p>모든 단어와 복습이 필요한 단어를 확인하고 편집합니다.</p>
        </div>
      </div>
    </section>

    <!-- 학습 조건 선택 (공간 / 태그 탭) -->
    <section id="sec-study-select" class="section">
      <div class="sub-container study-select-container">
        <div class="tab-header">
          <div class="tab-btn active" id="tabSpaceBtn" onclick="switchSelectTab('space')">공간별</div>
          <div class="tab-btn" id="tabTagBtn" onclick="switchSelectTab('tag')">태그별</div>
        </div>
        
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
          <span style="font-size: 0.85rem; color: var(--text-sub);" id="selectGuideText">출제할 공간 선택</span>
          <button class="btn-secondary" style="padding: 4px 8px; font-size: 0.8rem; flex: none;" onclick="toggleSelectAll()">전체 선택/해제</button>
        </div>

        <div class="space-select-list" id="studySelectList"></div>

        <div class="bottom-action-bar">
          <button class="btn-action-left" id="btnResetData" onclick="resetSelectedData()" disabled>회독 초기화</button>
          <button class="btn-action-mid" id="btnReviewStudy" onclick="startStudyExecution('review')" disabled>복습 단어 학습</button>
          <button class="btn-action-right" id="btnStartStudy" onclick="startStudyExecution('normal')" disabled>학습 시작</button>
        </div>
      </div>
    </section>

    <!-- 단어 학습 실행 -->
    <section id="sec-study-exec" class="section">
      <div class="study-container" id="studyArea">
        <div class="study-progress-top">
          <div class="study-progress-text">
            <span id="studyRoundText">1회독 진행 중</span>
            <span id="studyRatioText">0 / 0 (0%)</span>
          </div>
          <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="studyProgressBar"></div>
          </div>
        </div>

        <div class="study-card" onclick="event.stopPropagation();">
          <div class="word-display" id="studyWord">단어 불러오는 중...</div>
          <div class="meaning-display" id="studyMeaning">뜻</div>
          <div class="tag-badge-group" id="studyTagGroup"></div>
        </div>

        <!-- 좌측 하단 수정 버튼 (크기 확대) -->
        <button class="btn-edit-in-study" onclick="event.stopPropagation(); openModal(currentStudyWord.id)">✏️ 수정</button>

        <!-- 우측 하단 복습 필요 토글 (크기 확대) -->
        <label class="review-check" id="reviewBox" onclick="event.stopPropagation();">
          <span>복습 필요</span>
          <input type="checkbox" id="chkReview">
          <span class="review-slider"></span>
        </label>

        <div class="study-hint" id="studyHint">화면을 터치하세요</div>
      </div>
    </section>

    <!-- 단어 추가 및 공간 관리 -->
    <section id="sec-add" class="section">
      <div class="sub-container">
        <div class="form-group">
          <label>공간 선택</label>
          <select id="saveSpaceSelect" class="form-select"></select>
        </div>
        <div class="form-group">
          <input type="text" id="inputEng" class="form-input" placeholder="영단어" style="margin-bottom: 8px;">
          <input type="text" id="inputKor" class="form-input" placeholder="뜻" style="margin-bottom: 8px;">
          <input type="text" id="inputTags" class="form-input" placeholder="태그 (쉼표 구분: 괴롭히다, 고급동사)">
        </div>
        <button class="btn-primary" onclick="addSingleWord()">단어 저장하기</button>

        <div class="accordion-toggle" onclick="toggleBatchAccordion()">
          <span>일괄 입력</span>
          <span id="accordionArrow">&gt;</span>
        </div>
        <div class="accordion-content" id="batchAccordionContent">
          <div class="form-group">
            <textarea id="inputBatch" class="form-textarea" placeholder="apple:사과&#10;banana:바나나"></textarea>
          </div>
          <button class="btn-primary" onclick="addBatchWords()">일괄 저장하기</button>
        </div>

        <div class="divider"><span>공간 관리</span></div>

        <div class="form-group">
          <label>새 공간 생성 (최대 15자)</label>
          <div class="space-manage-box">
            <input type="text" id="newSpaceName" class="form-input" maxlength="15" placeholder="공간 이름 입력">
            <button class="btn-primary" style="width: 90px; flex-shrink: 0;" onclick="createNewSpace()">생성</button>
          </div>
        </div>

        <div class="form-group">
          <label>공간 편집</label>
          <select id="editSpaceSelect" class="form-select" style="margin-bottom: 8px;"></select>
          <div class="space-manage-box">
            <input type="text" id="renameSpaceName" class="form-input" maxlength="15" placeholder="바꿀 이름 입력">
            <button class="btn-secondary" style="width: 75px; flex: none;" onclick="renameSpace()">수정</button>
            <button class="btn-danger" style="width: 75px; flex: none;" onclick="deleteSpace()">삭제</button>
          </div>
        </div>
      </div>
    </section>

    <!-- 목록 조회 -->
    <section id="sec-list" class="section">
      <div class="list-header-area">
        <input type="text" id="searchInput" class="search-input" placeholder="단어, 뜻, 공간 또는 태그 검색..." oninput="renderList()">
      </div>
      <div class="word-list-scroll">
        <div class="list-container" id="vocabList"></div>
      </div>
    </section>

  </main>

  <!-- 단어 수정 모달 -->
  <div class="modal-overlay" id="editModal">
    <div class="modal-box">
      <div class="modal-title">단어 수정</div>
      <input type="text" id="editEng" class="form-input" placeholder="영단어">
      <input type="text" id="editKor" class="form-input" placeholder="뜻">
      <input type="text" id="editTags" class="form-input" placeholder="태그 (쉼표 구분)">
      <div class="form-group" style="margin: 0;">
        <label>소속 공간</label>
        <select id="editWordSpaceSelect" class="form-select"></select>
      </div>
      <div class="modal-btns">
        <button class="btn-danger" onclick="deleteCurrentWord()">삭제</button>
        <button class="btn-secondary" onclick="closeModal()">취소</button>
        <button class="btn-primary" style="flex: 1;" onclick="saveEditWord()">저장</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="reviewListModal">
    <div class="modal-box">
      <div class="modal-title" style="color: var(--accent-color);">🔖 복습이 필요한 단어</div>
      <div id="reviewModalList" style="overflow-y: auto; display: flex; flex-direction: column; gap: 8px; max-height: 50vh;"></div>
      <button class="btn-secondary" style="flex: none;" onclick="closeReviewModal()">닫기</button>
    </div>
  </div>

  <script>
    const PREV_ZONE_RATIO = 0.35; // 좌측 35% 터치 시 이전 단어

    let spaces = JSON.parse(localStorage.getItem('my_spaces_db')) || [];
    let vocab = JSON.parse(localStorage.getItem('my_vocab_db')) || [];
    let currentTheme = localStorage.getItem('my_vocab_theme') || 'light';

    let currentSelectTab = 'space'; // 'space' | 'tag'
    let selectedKeys = [];
    let studyMode = 'normal';
    
    let currentStudyWord = null;
    let currentRound = 1;
    let isMeaningVisible = false;
    let previousStudyState = null; // { word, round, wasMeaningVisible }
    let editingId = null;

    const themeSwitch = document.getElementById('themeSwitch');
    const backBtn = document.getElementById('backBtn');
    const headerTitle = document.getElementById('headerTitle');
    const chkReview = document.getElementById('chkReview');
    const reviewBox = document.getElementById('reviewBox');

    function sortNames(arr) {
      return [...arr].sort((a, b) => a.localeCompare(b, 'ko-KR', { numeric: true, sensitivity: 'base' }));
    }

    function init() {
      vocab.forEach(v => {
        if (v.weight === undefined) v.weight = 0;
        if (v.rweight === undefined) v.rweight = 0;
        if (!Array.isArray(v.tags)) v.tags = v.tags ? [v.tags] : [];
        v.review = !!v.review;
      });

      if (currentTheme === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
        themeSwitch.checked = true;
      }
      saveData();
    }

    function saveData() {
      localStorage.setItem('my_spaces_db', JSON.stringify(spaces));
      localStorage.setItem('my_vocab_db', JSON.stringify(vocab));
    }

    themeSwitch.addEventListener('change', (e) => {
      if (e.target.checked) {
        document.documentElement.setAttribute('data-theme', 'dark');
        localStorage.setItem('my_vocab_theme', 'dark');
      } else {
        document.documentElement.removeAttribute('data-theme');
        localStorage.setItem('my_vocab_theme', 'light');
      }
    });

    function navTo(secName) {
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      if (secName === 'home') {
        document.getElementById('sec-home').classList.add('active');
        backBtn.style.visibility = 'hidden';
        headerTitle.textContent = '단어장';
      } else {
        document.getElementById(`sec-${secName}`).classList.add('active');
        backBtn.style.visibility = 'visible';
        if (secName === 'study-select') {
          headerTitle.textContent = '학습 조건 선택';
          renderSelectList();
        } else if (secName === 'add') {
          headerTitle.textContent = '단어 저장 및 공간 관리';
          renderSpaceOptions();
        } else if (secName === 'list') {
          headerTitle.textContent = '저장 단어 확인';
          renderList();
        }
      }
    }

    backBtn.addEventListener('click', () => {
      const activeSec = document.querySelector('.section.active').id;
      navTo(activeSec === 'sec-study-exec' ? 'study-select' : 'home');
    });

    function switchSelectTab(tab) {
      currentSelectTab = tab;
      document.getElementById('tabSpaceBtn').classList.toggle('active', tab === 'space');
      document.getElementById('tabTagBtn').classList.toggle('active', tab === 'tag');
      document.getElementById('selectGuideText').textContent = tab === 'space' ? '출제할 공간 선택' : '출제할 태그 선택';
      renderSelectList();
    }

    function getAllTags() {
      const tagSet = new Set();
      vocab.forEach(v => v.tags.forEach(t => tagSet.add(t)));
      return sortNames(Array.from(tagSet));
    }

    function renderSelectList() {
      const container = document.getElementById('studySelectList');
      container.innerHTML = '';

      const items = currentSelectTab === 'space' ? sortNames(spaces) : getAllTags();

      if (items.length === 0) {
        container.innerHTML = `<div class="empty-msg">${currentSelectTab === 'space' ? '생성된 공간이 없습니다.' : '등록된 태그가 없습니다.'}</div>`;
        updateStudyButtonState();
        return;
      }

      items.forEach(key => {
        const pool = vocab.filter(v => currentSelectTab === 'space' ? v.space === key : v.tags.includes(key));
        const total = pool.length;
        const rev = pool.filter(v => v.review).length;
        
        const field = 'weight';
        const minW = total > 0 ? Math.min(...pool.map(v => v[field] || 0)) : 0;
        const doneCount = pool.filter(v => (v[field] || 0) > minW).length;
        const roundNum = minW + 1;
        const percent = total > 0 ? Math.round((doneCount / total) * 100) : 0;

        const card = document.createElement('div');
        card.className = 'space-card-item';
        card.innerHTML = `
          <div class="space-card-header">
            <label class="space-card-title" onclick="event.stopPropagation();">
              <input type="checkbox" value="${escapeHtml(key)}" onchange="updateStudyButtonState()">
              <span>${currentSelectTab === 'tag' ? '#' : ''}${escapeHtml(key)}</span>
            </label>
            <span style="font-size: 0.8rem; color: var(--text-sub);">${total}단어 ${rev ? `· 복습 ${rev}` : ''}</span>
          </div>
          <div class="progress-box">
            <div class="progress-info">
              <span>${roundNum}회독 진행 중 (${doneCount}/${total})</span>
              <span>${percent}%</span>
            </div>
            <div class="progress-bar-bg">
              <div class="progress-bar-fill" style="width: ${percent}%;"></div>
            </div>
          </div>
        `;
        card.onclick = (e) => {
          if (e.target.tagName !== 'INPUT') {
            const cb = card.querySelector('input[type="checkbox"]');
            cb.checked = !cb.checked;
            updateStudyButtonState();
          }
        };
        container.appendChild(card);
      });

      updateStudyButtonState();
    }

    function toggleSelectAll() {
      const cbs = document.querySelectorAll('#studySelectList input[type="checkbox"]');
      const allChecked = Array.from(cbs).every(cb => cb.checked);
      cbs.forEach(cb => cb.checked = !allChecked);
      updateStudyButtonState();
    }

    function updateStudyButtonState() {
      const has = document.querySelectorAll('#studySelectList input[type="checkbox"]:checked').length > 0;
      document.getElementById('btnResetData').disabled = !has;
      document.getElementById('btnReviewStudy').disabled = !has;
      document.getElementById('btnStartStudy').disabled = !has;
    }

    function resetSelectedData() {
      const selected = Array.from(document.querySelectorAll('#studySelectList input[type="checkbox"]:checked')).map(cb => cb.value);
      if (selected.length === 0) return;

      if (confirm('선택한 항목 단어들의 회독 기록을 초기화하시겠습니까?')) {
        vocab.forEach(item => {
          const match = currentSelectTab === 'space' ? selected.includes(item.space) : item.tags.some(t => selected.includes(t));
          if (match) { item.weight = 0; item.rweight = 0; }
        });
        saveData();
        renderSelectList();
        alert('회독 기록이 초기화되었습니다.');
      }
    }

    function getStudyPool() {
      return vocab.filter(v => {
        const match = currentSelectTab === 'space' ? selectedKeys.includes(v.space) : v.tags.some(t => selectedKeys.includes(t));
        return match && (studyMode === 'normal' || v.review);
      });
    }

    function startStudyExecution(mode) {
      studyMode = mode;
      selectedKeys = Array.from(document.querySelectorAll('#studySelectList input[type="checkbox"]:checked')).map(cb => cb.value);

      if (getStudyPool().length === 0) {
        alert(mode === 'review' ? '선택한 조건에 복습 단어가 없습니다.' : '선택한 조건에 등록된 단어가 없습니다.');
        return;
      }

      currentStudyWord = null;
      currentRound = 1;
      previousStudyState = null;
      navTo('study-exec');
      headerTitle.textContent = mode === 'review' ? '복습 집중 학습' : '랜덤 학습';
      nextStudyWord();
    }

    function pickWord(pool, field) {
      const min = Math.min(...pool.map(w => w[field] || 0));
      const unseen = pool.filter(w => (w[field] || 0) === min);
      return { word: unseen[Math.floor(Math.random() * unseen.length)], round: min + 1 };
    }

    function updateStudyProgressBar() {
      const pool = getStudyPool();
      if (pool.length === 0) return;

      const field = studyMode === 'review' ? 'rweight' : 'weight';
      const minW = Math.min(...pool.map(v => v[field] || 0));
      const doneCount = pool.filter(v => (v[field] || 0) > minW).length;
      const total = pool.length;
      const percent = Math.round((doneCount / total) * 100);

      document.getElementById('studyRoundText').textContent = `${minW + 1}회독 진행 중`;
      document.getElementById('studyRatioText').textContent = `${doneCount} / ${total} (${percent}%)`;
      document.getElementById('studyProgressBar').style.width = `${percent}%`;
    }

    function showStudyWord() {
      document.getElementById('studyWord').textContent = currentStudyWord.eng;
      document.getElementById('studyMeaning').textContent = currentStudyWord.kor;
      chkReview.checked = !!currentStudyWord.review;

      // 태그 세팅
      const tagGroup = document.getElementById('studyTagGroup');
      tagGroup.innerHTML = (currentStudyWord.tags || []).map(t => `<span class="tag-badge">#${escapeHtml(t)}</span>`).join('');

      updateStudyProgressBar();
    }

    function nextStudyWord() {
      reviewBox.classList.remove('visible');
      document.getElementById('studyMeaning').classList.remove('visible');

      const pool = getStudyPool();
      if (pool.length === 0) {
        document.getElementById('studyWord').textContent = "단어가 없습니다";
        document.getElementById('studyMeaning').textContent = "";
        currentStudyWord = null;
        return;
      }

      const field = studyMode === 'review' ? 'rweight' : 'weight';
      const picked = pickWord(pool, field);
      
      currentStudyWord = picked.word;
      currentRound = picked.round;
      currentStudyWord[field] = (currentStudyWord[field] || 0) + 1;

      saveData();
      showStudyWord();

      document.getElementById('studyHint').textContent = previousStudyState ? "좌측: 전 단어 | 우측: 뜻 공개/다음 단어" : "화면을 터치하면 뜻이 공개됩니다";
      isMeaningVisible = false;
    }

    function goPreviousStudyWord() {
      if (!previousStudyState) return;

      const prev = previousStudyState;
      currentStudyWord = prev.word;
      currentRound = prev.round;
      
      showStudyWord();

      if (prev.wasMeaningVisible) {
        document.getElementById('studyMeaning').classList.add('visible');
        reviewBox.classList.add('visible');
        isMeaningVisible = true;
      } else {
        document.getElementById('studyMeaning').classList.remove('visible');
        reviewBox.classList.remove('visible');
        isMeaningVisible = false;
      }

      document.getElementById('studyHint').textContent = "화면 우측을 터치하면 다음 단어로 넘어갑니다";
      previousStudyState = null;
    }

    chkReview.addEventListener('change', () => {
      if (!currentStudyWord) return;
      currentStudyWord.review = chkReview.checked;
      saveData();
    });

    document.getElementById('studyArea').addEventListener('click', (e) => {
      if (!currentStudyWord) return;

      const rect = e.currentTarget.getBoundingClientRect();
      const clickX = e.clientX - rect.left;

      // 좌측 35% 터치 -> 이전 단어 (뜻 상태 보존)
      if (clickX < rect.width * PREV_ZONE_RATIO && previousStudyState) {
        goPreviousStudyWord();
        return;
      }

      // 우측 터치 -> 뜻 공개 / 다음 단어
      if (!isMeaningVisible) {
        document.getElementById('studyMeaning').classList.add('visible');
        reviewBox.classList.add('visible');
        document.getElementById('studyHint').textContent = "화면을 터치하면 다음 단어로 넘어갑니다";
        isMeaningVisible = true;
      } else {
        previousStudyState = {
          word: currentStudyWord,
          round: currentRound,
          wasMeaningVisible: true
        };
        nextStudyWord();
      }
    });

    function renderSpaceOptions() {
      const saveSelect = document.getElementById('saveSpaceSelect');
      const editSelect = document.getElementById('editSpaceSelect');
      saveSelect.innerHTML = '<option value="">(비어 있음)</option>';
      editSelect.innerHTML = '<option value="">(비어 있음)</option>';

      sortNames(spaces).forEach(sp => {
        [saveSelect, editSelect].forEach(sel => {
          const opt = document.createElement('option');
          opt.value = sp;
          opt.textContent = sp;
          sel.appendChild(opt);
        });
      });
    }

    function toggleBatchAccordion() {
      const content = document.getElementById('batchAccordionContent');
      const open = content.classList.toggle('open');
      document.getElementById('accordionArrow').textContent = open ? 'v' : '>';
    }

    function createNewSpace() {
      const name = document.getElementById('newSpaceName').value.trim();
      if (!name) { alert('공간 이름을 입력해주세요.'); return; }
      if (spaces.includes(name)) { alert('이미 존재하는 공간입니다.'); return; }

      spaces.push(name);
      saveData();
      document.getElementById('newSpaceName').value = '';
      renderSpaceOptions();
      alert(`'${name}' 공간이 생성되었습니다.`);
    }

    function renameSpace() {
      const oldName = document.getElementById('editSpaceSelect').value;
      const newName = document.getElementById('renameSpaceName').value.trim();

      if (!oldName || !newName) { alert('공간 선택 및 바꿀 이름을 입력해주세요.'); return; }

      const idx = spaces.indexOf(oldName);
      if (idx !== -1) {
        spaces[idx] = newName;
        vocab.forEach(v => { if (v.space === oldName) v.space = newName; });
        saveData();
        document.getElementById('renameSpaceName').value = '';
        renderSpaceOptions();
        alert('수정되었습니다.');
      }
    }

    function deleteSpace() {
      const target = document.getElementById('editSpaceSelect').value;
      if (!target) return;

      if (confirm(`${target} 공간을 삭제하시겠습니까?`)) {
        spaces = spaces.filter(s => s !== target);
        vocab = vocab.filter(v => v.space !== target);
        saveData();
        renderSpaceOptions();
        alert('삭제되었습니다.');
      }
    }

    function parseCommaList(str) {
      return str.split(',').map(s => s.trim()).filter(Boolean);
    }

    function addSingleWord() {
      const space = document.getElementById('saveSpaceSelect').value;
      const eng = document.getElementById('inputEng').value.trim();
      const kor = document.getElementById('inputKor').value.trim();
      const tags = parseCommaList(document.getElementById('inputTags').value);

      if (!space || !eng || !kor) { alert('공간, 영단어, 뜻을 입력해주세요.'); return; }

      vocab.push({ id: Date.now() + Math.random(), eng, kor, space, tags, weight: 0, rweight: 0, review: false });
      saveData();
      document.getElementById('inputEng').value = '';
      document.getElementById('inputKor').value = '';
      document.getElementById('inputTags').value = '';
      alert('단어가 저장되었습니다.');
    }

    function addBatchWords() {
      const space = document.getElementById('saveSpaceSelect').value;
      const text = document.getElementById('inputBatch').value.trim();

      if (!space || !text) { alert('공간 선택 및 단어를 입력해주세요.'); return; }

      let count = 0;
      text.split('\n').forEach(line => {
        const parts = line.split(':');
        if (parts.length >= 2) {
          const eng = parts[0].trim();
          const kor = parts.slice(1).join(':').trim();
          if (eng && kor) {
            vocab.push({ id: Date.now() + Math.random(), eng, kor, space, tags: [], weight: 0, rweight: 0, review: false });
            count++;
          }
        }
      });

      if (count > 0) {
        saveData();
        document.getElementById('inputBatch').value = '';
        alert(`${count}개 단어가 저장되었습니다.`);
      }
    }

    function renderList() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      const vocabList = document.getElementById('vocabList');
      vocabList.innerHTML = '';

      const revCard = document.createElement('div');
      revCard.className = 'folder-card';
      revCard.onclick = openReviewModal;
      revCard.innerHTML = `<div class="folder-card-title">🔖 복습이 필요한 단어</div><div class="folder-card-count">${vocab.filter(v => v.review).length}개</div>`;
      vocabList.appendChild(revCard);

      const filtered = vocab.filter(v => 
        v.eng.toLowerCase().includes(query) ||
        v.kor.toLowerCase().includes(query) ||
        v.space.toLowerCase().includes(query) ||
        v.tags.some(t => t.toLowerCase().includes(query))
      ).sort((a,b) => a.eng.localeCompare(b.eng));

      filtered.forEach(item => {
        const div = document.createElement('div');
        div.className = 'word-item';
        div.onclick = () => openModal(item.id);
        div.innerHTML = `
          <div class="word-item-info">
            <div class="word-item-eng">${escapeHtml(item.eng)}</div>
            <div class="word-item-kor">${escapeHtml(item.kor)}</div>
          </div>
          <div class="word-item-meta">
            ${item.review ? '<div class="word-review-badge">🔖 복습</div>' : ''}
            <div class="word-space-badge">${escapeHtml(item.space)}</div>
          </div>
        `;
        vocabList.appendChild(div);
      });
    }

    function openReviewModal() {
      const modalList = document.getElementById('reviewModalList');
      modalList.innerHTML = '';
      const words = vocab.filter(v => v.review);

      words.forEach(item => {
        const div = document.createElement('div');
        div.className = 'word-item';
        div.onclick = () => { closeReviewModal(); openModal(item.id); };
        div.innerHTML = `<div class="word-item-info"><div class="word-item-eng">${escapeHtml(item.eng)}</div><div class="word-item-kor">${escapeHtml(item.kor)}</div></div>`;
        modalList.appendChild(div);
      });
      document.getElementById('reviewListModal').classList.add('active');
    }

    function closeReviewModal() { document.getElementById('reviewListModal').classList.remove('active'); }

    function openModal(id) {
      editingId = id;
      const item = vocab.find(v => v.id === id);
      if (!item) return;

      document.getElementById('editEng').value = item.eng;
      document.getElementById('editKor').value = item.kor;
      document.getElementById('editTags').value = (item.tags || []).join(', ');

      const sel = document.getElementById('editWordSpaceSelect');
      sel.innerHTML = '';
      sortNames(spaces).forEach(sp => {
        const opt = document.createElement('option');
        opt.value = sp; opt.textContent = sp;
        if (sp === item.space) opt.selected = true;
        sel.appendChild(opt);
      });

      document.getElementById('editModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('editModal').classList.remove('active');
      editingId = null;
    }

    function saveEditWord() {
      const item = vocab.find(v => v.id === editingId);
      if (item) {
        item.eng = document.getElementById('editEng').value.trim();
        item.kor = document.getElementById('editKor').value.trim();
        item.tags = parseCommaList(document.getElementById('editTags').value);
        item.space = document.getElementById('editWordSpaceSelect').value;

        saveData();
        closeModal();
        if (document.getElementById('sec-study-exec').classList.contains('active')) {
          showStudyWord();
        } else {
          renderList();
        }
      }
    }

    function deleteCurrentWord() {
      if (confirm('이 단어를 삭제하시겠습니까?')) {
        vocab = vocab.filter(v => v.id !== editingId);
        saveData();
        closeModal();
        if (document.getElementById('sec-study-exec').classList.contains('active')) {
          nextStudyWord();
        } else {
          renderList();
        }
      }
    }

    function escapeHtml(str) {
      return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    init();
  </script>
</body>
</html>
