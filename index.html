<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>단어장 앱</title>
  <style>
    :root {
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --text-color: #212529;
      --text-sub: #6c757d;
      --accent-color: #0d6efd;
      --border-color: #e9ecef;
      --input-bg: #ffffff;
      --shadow-color: rgba(0, 0, 0, 0.05);
    }
    [data-theme="dark"] {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-color: #f8f9fa;
      --text-sub: #adb5bd;
      --accent-color: #3d8bfd;
      --border-color: #2c2c2c;
      --input-bg: #2a2a2a;
      --shadow-color: rgba(0, 0, 0, 0.3);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .app-header {
      height: 56px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid var(--border-color); background-color: var(--bg-color); z-index: 100; flex-shrink: 0;
    }
    .header-btn { background: none; border: none; color: var(--text-color); font-size: 1.2rem; cursor: pointer; padding: 8px; display: flex; align-items: center; justify-content: center; }
    .header-title { font-size: 1.1rem; font-weight: 600; }

    .theme-toggle { display: flex; align-items: center; cursor: pointer; }
    .theme-toggle input { display: none; }
    .toggle-slider { width: 44px; height: 24px; background-color: #ccc; border-radius: 12px; position: relative; transition: 0.3s; flex-shrink: 0; }
    .toggle-slider::before { content: ""; position: absolute; width: 18px; height: 18px; border-radius: 50%; background-color: white; top: 3px; left: 3px; transition: 0.3s; }
    input:checked + .toggle-slider { background-color: var(--accent-color); }
    input:checked + .toggle-slider::before { transform: translateX(20px); }

    .content-area { flex: 1; position: relative; overflow: hidden; }
    .section { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; flex-direction: column; }
    .section.active { display: flex; }

    .home-container { padding: 24px 16px; display: flex; flex-direction: column; gap: 16px; max-width: 500px; margin: 0 auto; width: 100%; height: 100%; justify-content: center; }
    .menu-card { background-color: var(--card-bg); padding: 24px 20px; border-radius: 16px; border: 1px solid var(--border-color); box-shadow: 0 4px 12px var(--shadow-color); cursor: pointer; transition: transform 0.1s; display: flex; flex-direction: column; gap: 8px; }
    .menu-card:active { transform: scale(0.98); }
    .menu-card h2 { font-size: 1.25rem; color: var(--accent-color); }
    .menu-card p { font-size: 0.9rem; color: var(--text-sub); }

    .sub-container { padding: 20px 16px; overflow-y: auto; max-width: 500px; margin: 0 auto; width: 100%; flex: 1; }

    .space-select-list { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; max-height: 300px; overflow-y: auto; }
    .space-checkbox-item { display: flex; align-items: center; gap: 10px; background-color: var(--card-bg); padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border-color); font-size: 0.95rem; cursor: pointer; }
    .space-checkbox-item input { width: 18px; height: 18px; accent-color: var(--accent-color); }

    .bottom-action-bar { margin-top: 24px; display: flex; gap: 12px; }
    .btn-action-left { flex: 1; padding: 14px; border-radius: 10px; border: 1px solid var(--border-color); background-color: var(--card-bg); color: #dc3545; font-size: 0.95rem; font-weight: 600; cursor: pointer; }
    .btn-action-left:disabled { opacity: 0.4; cursor: not-allowed; color: var(--text-sub); }
    .btn-action-right { flex: 1; padding: 14px; border-radius: 10px; border: none; background-color: var(--accent-color); color: white; font-size: 0.95rem; font-weight: 600; cursor: pointer; }
    .btn-action-right:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-action-mid { flex: 1; padding: 14px; border-radius: 10px; border: 1px solid var(--accent-color); background-color: var(--card-bg); color: var(--accent-color); font-size: 0.95rem; font-weight: 600; cursor: pointer; }
    .btn-action-mid:disabled { opacity: 0.4; cursor: not-allowed; }
    .bottom-action-bar button { font-size: 0.85rem; padding: 14px 4px; }
    .dup-group { border: 1px solid var(--border-color); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
    .dup-row { display: flex; justify-content: space-between; gap: 8px; font-size: 0.9rem; }
    .dup-row small { color: var(--text-sub); }
    .dup-keep b { color: var(--accent-color); }
    .dup-remove b { color: #dc3545; }
    .dup-remove { color: var(--text-sub); }

    .study-container { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 30px 20px; text-align: center; cursor: pointer; position: relative; }
    .study-stats-top { position: absolute; top: 20px; font-size: 0.85rem; color: var(--text-sub); font-weight: 500; }
    .word-display { font-size: 2.5rem; font-weight: 700; margin-bottom: 20px; word-break: break-word; }
    .meaning-display { font-size: 1.6rem; color: var(--accent-color); min-height: 2.2rem; visibility: hidden; word-break: break-word; font-weight: 500; margin-bottom: 16px; }
    .meaning-display.visible { visibility: visible; }

    .review-check { position: absolute; bottom: 70px; left: 24px; display: none; align-items: center; gap: 10px; font-size: 1.2rem; font-weight: 600; cursor: pointer; }
    .review-check.visible { display: flex; }
    .review-check input { width: 24px; height: 24px; accent-color: var(--accent-color); cursor: pointer; }
    .study-hint { position: absolute; bottom: 24px; font-size: 0.85rem; color: var(--text-sub); }

    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 8px; color: var(--text-sub); }
    .form-input, .form-textarea, .form-select { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border-color); background-color: var(--input-bg); color: var(--text-color); font-size: 0.95rem; outline: none; user-select: text; }
    .form-textarea { height: 100px; resize: none; }
    .btn-primary { width: 100%; padding: 12px; border-radius: 10px; border: none; background-color: var(--accent-color); color: white; font-size: 0.95rem; font-weight: 600; cursor: pointer; }
    .space-manage-box { display: flex; gap: 8px; }
    .accordion-toggle { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 10px; font-size: 0.9rem; font-weight: 600; cursor: pointer; margin: 12px 0; }
    .accordion-content { display: none; padding-bottom: 12px; }
    .accordion-content.open { display: block; }
    .divider { text-align: center; margin: 24px 0 16px 0; position: relative; }
    .divider::before { content: ""; position: absolute; top: 50%; left: 0; width: 100%; height: 1px; background-color: var(--border-color); z-index: 1; }
    .divider span { position: relative; z-index: 2; background-color: var(--bg-color); padding: 0 12px; font-size: 0.85rem; color: var(--text-sub); }

    .list-header-area { padding: 12px 16px; background-color: var(--bg-color); border-bottom: 1px solid var(--border-color); flex-shrink: 0; }
    .search-input { width: 100%; padding: 12px 16px; border-radius: 10px; border: 1px solid var(--border-color); background-color: var(--input-bg); color: var(--text-color); font-size: 0.95rem; outline: none; user-select: text; }
    .word-list-scroll { flex: 1; overflow-y: auto; padding: 16px; }
    .list-container { max-width: 500px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; padding-bottom: 40px; }

    .folder-card { background-color: rgba(13, 110, 253, 0.08); border: 1.5px solid var(--accent-color); border-radius: 12px; padding: 16px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; margin-bottom: 6px; }
    .folder-card-title { font-size: 1rem; font-weight: 700; color: var(--accent-color); display: flex; align-items: center; gap: 8px; }
    .folder-card-count { font-size: 0.85rem; font-weight: 600; color: var(--accent-color); background-color: rgba(13, 110, 253, 0.15); padding: 2px 8px; border-radius: 12px; }

    .word-item { background-color: var(--card-bg); padding: 14px 16px; border-radius: 12px; border: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
    .word-item-info { display: flex; flex-direction: column; gap: 4px; user-select: text; }
    .word-item-eng { font-size: 1.05rem; font-weight: 600; }
    .word-item-kor { font-size: 0.9rem; color: var(--text-sub); }
    .word-item-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; font-size: 0.8rem; }
    .word-review-badge { color: var(--accent-color); font-weight: 600; }
    .word-space-badge { background-color: var(--border-color); color: var(--text-sub); padding: 2px 6px; border-radius: 6px; }
    .empty-msg { text-align: center; color: var(--text-sub); padding: 40px 0; font-size: 0.95rem; }

    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.5); display: none; justify-content: center; align-items: center; z-index: 200; padding: 20px; }
    .modal-overlay.active { display: flex; }
    .modal-box { background-color: var(--card-bg); border-radius: 16px; width: 100%; max-width: 400px; padding: 20px; display: flex; flex-direction: column; gap: 16px; max-height: 80vh; }
    .modal-title { font-size: 1.1rem; font-weight: 600; }
    .modal-btns { display: flex; gap: 8px; }
    .btn-secondary { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); background: none; color: var(--text-color); font-weight: 600; cursor: pointer; }
    .btn-danger { flex: 1; padding: 12px; border-radius: 8px; border: none; background-color: #dc3545; color: white; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>

  <header class="app-header">
    <button class="header-btn" id="backBtn" style="visibility: hidden;">&#x2190;</button>
    <div class="header-title" id="headerTitle">단어장</div>
    <label class="theme-toggle">
      <input type="checkbox" id="themeSwitch">
      <span class="toggle-slider"></span>
    </label>
  </header>

  <main class="content-area">

    <section id="sec-home" class="section active">
      <div class="home-container">
        <div class="menu-card" onclick="navTo('study-select')">
          <h2>1. 랜덤 단어 학습</h2>
          <p>저장 공간을 선택하고 단어를 학습합니다.</p>
        </div>
        <div class="menu-card" onclick="navTo('add')">
          <h2>2. 단어 저장 및 공간 관리</h2>
          <p>공간을 선택하여 단어를 추가하거나 공간을 편집합니다.</p>
        </div>
        <div class="menu-card" onclick="navTo('list')">
          <h2>3. 저장 단어 확인</h2>
          <p>모든 단어와 복습이 필요한 단어를 확인하고 편집합니다.</p>
        </div>
      </div>
    </section>

    <section id="sec-study-select" class="section">
      <div class="sub-container">
        <div class="form-group" style="margin-bottom: 8px;">
          <label style="display: flex; justify-content: space-between; align-items: center;">
            출제할 단어 저장 공간 선택
            <button class="btn-secondary" style="padding: 4px 8px; font-size: 0.8rem; flex: none;" onclick="toggleSelectAllSpaces()">전체 선택/해제</button>
          </label>
        </div>
        <div class="space-select-list" id="studySpaceList"></div>
        <div class="bottom-action-bar">
          <button class="btn-action-left" id="btnResetData" onclick="resetSelectedSpacesData()" disabled>출제 횟수 초기화</button>
          <button class="btn-action-mid" id="btnReviewStudy" onclick="startStudyExecution('review')" disabled>복습 단어 집중 학습</button>
          <button class="btn-action-right" id="btnStartStudy" onclick="startStudyExecution('normal')" disabled>학습 시작</button>
        </div>
      </div>
    </section>

    <section id="sec-study-exec" class="section">
      <div class="study-container" id="studyArea">
        <div class="study-stats-top" id="studyStatsTop"></div>
        <div class="word-display" id="studyWord">단어 불러오는 중...</div>
        <div class="meaning-display" id="studyMeaning">뜻</div>

        <label class="review-check" id="reviewBox" onclick="event.stopPropagation();">
          <input type="checkbox" id="chkReview">
          <span>복습 필요</span>
        </label>

        <div class="study-hint" id="studyHint">화면을 터치하세요</div>
      </div>
    </section>

    <section id="sec-add" class="section">
      <div class="sub-container">
        <div class="form-group">
          <label>공간 선택</label>
          <select id="saveSpaceSelect" class="form-select"></select>
        </div>
        <div class="form-group">
          <input type="text" id="inputEng" class="form-input" placeholder="영단어" style="margin-bottom: 8px;">
          <input type="text" id="inputKor" class="form-input" placeholder="뜻">
        </div>
        <button class="btn-primary" onclick="addSingleWord()">단어 저장하기</button>

        <div class="accordion-toggle" onclick="toggleBatchAccordion()">
          <span>일괄 입력</span>
          <span id="accordionArrow">&gt;</span>
        </div>
        <div class="accordion-content" id="batchAccordionContent">
          <div class="form-group">
            <textarea id="inputBatch" class="form-textarea" placeholder="apple:사과&#10;banana:바나나"></textarea>
          </div>
          <button class="btn-primary" onclick="addBatchWords()">일괄 저장하기</button>
        </div>

        <div class="divider"><span>공간 관리</span></div>

        <div class="form-group">
          <label>새 공간 생성 (최대 15자)</label>
          <div class="space-manage-box">
            <input type="text" id="newSpaceName" class="form-input" maxlength="15" placeholder="공간 이름 입력">
            <button class="btn-primary" style="width: 90px; flex-shrink: 0;" onclick="createNewSpace()">생성</button>
          </div>
        </div>

        <div class="form-group">
          <label>공간 편집</label>
          <select id="editSpaceSelect" class="form-select" style="margin-bottom: 8px;"></select>
          <div class="space-manage-box">
            <input type="text" id="renameSpaceName" class="form-input" maxlength="15" placeholder="바꿀 이름 입력">
            <button class="btn-secondary" style="width: 75px; flex: none;" onclick="renameSpace()">수정</button>
            <button class="btn-danger" style="width: 75px; flex: none;" onclick="deleteSpace()">삭제</button>
          </div>
        </div>
      </div>
    </section>

    <section id="sec-list" class="section">
      <div class="list-header-area">
        <input type="text" id="searchInput" class="search-input" placeholder="단어, 뜻 또는 공간 검색..." oninput="renderList()">
      </div>
      <div class="word-list-scroll">
        <div class="list-container" id="vocabList"></div>
      </div>
    </section>

  </main>

  <div class="modal-overlay" id="editModal">
    <div class="modal-box">
      <div class="modal-title">단어 수정</div>
      <input type="text" id="editEng" class="form-input" placeholder="영단어">
      <input type="text" id="editKor" class="form-input" placeholder="뜻">
      <div class="form-group" style="margin: 0;">
        <label>소속 공간</label>
        <select id="editWordSpaceSelect" class="form-select"></select>
      </div>
      <div class="modal-btns">
        <button class="btn-danger" onclick="deleteCurrentWord()">삭제</button>
        <button class="btn-secondary" onclick="closeModal()">취소</button>
        <button class="btn-primary" style="flex: 1;" onclick="saveEditWord()">저장</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="reviewListModal">
    <div class="modal-box">
      <div class="modal-title" style="color: var(--accent-color);">📁 복습이 필요한 단어 (알파벳순)</div>
      <div id="reviewModalList" style="overflow-y: auto; display: flex; flex-direction: column; gap: 8px; max-height: 50vh;"></div>
      <button class="btn-secondary" style="flex: none;" onclick="closeReviewModal()">닫기</button>
    </div>
  </div>

  <div class="modal-overlay" id="dupListModal">
    <div class="modal-box">
      <div class="modal-title" style="color: var(--accent-color);">📁 중복 단어</div>
      <div style="font-size: 0.8rem; color: var(--text-sub);">영단어가 같은 단어 중 뜻이 가장 긴 1개만 남기고 나머지를 삭제합니다.</div>
      <div id="dupModalList" style="overflow-y: auto; display: flex; flex-direction: column; gap: 8px; max-height: 45vh;"></div>
      <div class="modal-btns">
        <button class="btn-secondary" onclick="closeDupModal()">닫기</button>
        <button class="btn-danger" id="btnDeleteDup" onclick="deleteDuplicates()">중복 일괄 삭제</button>
      </div>
    </div>
  </div>

  <script>
    const REVIEW_FOLDER_NAME = "복습이 필요한 단어"; // 저장 단어 확인 화면의 폴더 이름 (공간이 아님)
    const OLD_REVIEW_NAMES = ["틀린 단어 모음", "복습이 필요한 단어"]; // 이전 버전 데이터 이전용
    const PICK_K = 4; // 후보 K개를 무작위로 뽑아 출제 횟수가 가장 적은 단어를 출제

    let spaces = JSON.parse(localStorage.getItem('my_spaces_db')) || [];
    let vocab = JSON.parse(localStorage.getItem('my_vocab_db')) || [];
    let currentTheme = localStorage.getItem('my_vocab_theme') || 'light';

    let activeStudySpaces = [];
    let studyMode = 'normal'; // 'normal' | 'review'
    let currentStudyWord = null;
    let previousStudyState = null;
    let nextPlannedWord = null;
    let isMeaningVisible = false;
    let editingId = null;

    const themeSwitch = document.getElementById('themeSwitch');
    const backBtn = document.getElementById('backBtn');
    const headerTitle = document.getElementById('headerTitle');
    const chkReview = document.getElementById('chkReview');
    const reviewBox = document.getElementById('reviewBox');

    function sortSpaceNames(arr) {
      return [...arr].sort((a, b) => {
        const getType = (str) => {
          const first = str.trim().charAt(0);
          if (/[0-9]/.test(first)) return 1;
          if (/[가-힣]/.test(first)) return 2;
          if (/[a-zA-Z]/.test(first)) return 3;
          return 4;
        };
        const typeA = getType(a), typeB = getType(b);
        if (typeA !== typeB) return typeA - typeB;
        return a.localeCompare(b, 'ko-KR', { numeric: true, sensitivity: 'base' });
      });
    }

    function init() {
      // 이전 버전 데이터 이전: 복습 공간의 복사본 -> 원본 단어의 review 표시로 변환
      const copies = vocab.filter(v => OLD_REVIEW_NAMES.includes(v.space));
      copies.forEach(c => {
        const original = vocab.find(o => o.id === c.originalId && !OLD_REVIEW_NAMES.includes(o.space));
        if (original) original.review = true;
      });
      vocab = vocab.filter(v => !OLD_REVIEW_NAMES.includes(v.space));
      spaces = spaces.filter(s => !OLD_REVIEW_NAMES.includes(s));
      vocab.forEach(v => {
        delete v.incorrect;
        delete v.originalId;
        if (v.rweight === undefined) v.rweight = 0;
        v.review = !!v.review;
      });

      if (currentTheme === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
        themeSwitch.checked = true;
      }
      saveData();
    }

    function saveData() {
      localStorage.setItem('my_spaces_db', JSON.stringify(spaces));
      localStorage.setItem('my_vocab_db', JSON.stringify(vocab));
    }

    themeSwitch.addEventListener('change', (e) => {
      if (e.target.checked) {
        document.documentElement.setAttribute('data-theme', 'dark');
        localStorage.setItem('my_vocab_theme', 'dark');
      } else {
        document.documentElement.removeAttribute('data-theme');
        localStorage.setItem('my_vocab_theme', 'light');
      }
    });

    function navTo(secName) {
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      if (secName === 'home') {
        document.getElementById('sec-home').classList.add('active');
        backBtn.style.visibility = 'hidden';
        headerTitle.textContent = '단어장';
      } else {
        document.getElementById(`sec-${secName}`).classList.add('active');
        backBtn.style.visibility = 'visible';
        if (secName === 'study-select') {
          headerTitle.textContent = '학습 공간 선택';
          renderStudySpaceList();
        } else if (secName === 'add') {
          headerTitle.textContent = '단어 저장 및 공간 관리';
          renderSpaceOptions();
        } else if (secName === 'list') {
          headerTitle.textContent = '저장 단어 확인';
          renderList();
        }
      }
    }

    backBtn.addEventListener('click', () => {
      const activeSec = document.querySelector('.section.active').id;
      navTo(activeSec === 'sec-study-exec' ? 'study-select' : 'home');
    });

    // --- [섹션 1: 학습 공간 선택 및 실행] ---
    function renderStudySpaceList() {
      const container = document.getElementById('studySpaceList');
      container.innerHTML = '';
      const sorted = sortSpaceNames(spaces);

      if (sorted.length === 0) {
        container.innerHTML = '<div class="empty-msg">생성된 공간이 없습니다.</div>';
      }

      sorted.forEach(sp => {
        const total = vocab.filter(v => v.space === sp).length;
        const rev = vocab.filter(v => v.space === sp && v.review).length;
        const label = document.createElement('label');
        label.className = 'space-checkbox-item';
        label.innerHTML = `
          <input type="checkbox" value="${escapeHtml(sp)}" onchange="updateStudyButtonState()">
          <span>${escapeHtml(sp)} (${total}개${rev ? ` · 복습 ${rev}개` : ''})</span>
        `;
        container.appendChild(label);
      });
      updateStudyButtonState();
    }

    function toggleSelectAllSpaces() {
      const checkboxes = document.querySelectorAll('#studySpaceList input[type="checkbox"]');
      const allChecked = Array.from(checkboxes).every(cb => cb.checked);
      checkboxes.forEach(cb => cb.checked = !allChecked);
      updateStudyButtonState();
    }

    function updateStudyButtonState() {
      const has = document.querySelectorAll('#studySpaceList input[type="checkbox"]:checked').length > 0;
      document.getElementById('btnResetData').disabled = !has;
      document.getElementById('btnReviewStudy').disabled = !has;
      document.getElementById('btnStartStudy').disabled = !has;
    }

    function resetSelectedSpacesData() {
      const selected = Array.from(document.querySelectorAll('#studySpaceList input[type="checkbox"]:checked')).map(cb => cb.value);
      if (selected.length === 0) return;

      if (confirm('선택한 공간 단어들의 출제 횟수(일반/복습 집중 모두)를 초기화하시겠습니까?\n(복습 표시는 유지됩니다)')) {
        vocab.forEach(item => {
          if (selected.includes(item.space)) { item.weight = 0; item.rweight = 0; }
        });
        saveData();
        alert('출제 횟수가 초기화되었습니다.');
      }
    }

    function getStudyPool() {
      return vocab.filter(v => activeStudySpaces.includes(v.space) && (studyMode === 'normal' || v.review));
    }

    function startStudyExecution(mode) {
      studyMode = mode;
      activeStudySpaces = Array.from(document.querySelectorAll('#studySpaceList input[type="checkbox"]:checked')).map(cb => cb.value);

      if (getStudyPool().length === 0) {
        alert(mode === 'review' ? '선택한 공간에 복습이 필요한 단어가 없습니다.' : '선택한 공간에 등록된 단어가 없습니다.');
        return;
      }

      currentStudyWord = null;
      previousStudyState = null;
      nextPlannedWord = null;
      navTo('study-exec');
      headerTitle.textContent = mode === 'review' ? '복습 집중 학습' : '랜덤 학습';
      nextStudyWord();
    }

    // K개 후보를 무작위로 뽑고, 그중 출제 횟수가 가장 적은 단어를 선택 (동점이면 무작위)
    function pickWord(pool, field) {
      const k = Math.min(PICK_K, pool.length);
      const chosen = new Set();
      while (chosen.size < k) chosen.add(Math.floor(Math.random() * pool.length));
      const cands = Array.from(chosen).map(i => pool[i]);
      const min = Math.min(...cands.map(w => w[field] || 0));
      const lows = cands.filter(w => (w[field] || 0) === min);
      return lows[Math.floor(Math.random() * lows.length)];
    }

    function showStudyWord() {
      document.getElementById('studyStatsTop').textContent = currentStudyWord.space;
      document.getElementById('studyWord').textContent = currentStudyWord.eng;
      document.getElementById('studyMeaning').textContent = currentStudyWord.kor;
      chkReview.checked = !!currentStudyWord.review;
    }

    function nextStudyWord() {
      // 토글(체크박스)은 화면이 넘어가는 즉시 숨김
      reviewBox.classList.remove('visible');
      document.getElementById('studyMeaning').classList.remove('visible');

      const pool = getStudyPool();
      if (pool.length === 0) {
        document.getElementById('studyWord').textContent = "단어가 없습니다";
        document.getElementById('studyMeaning').textContent = "";
        document.getElementById('studyStatsTop').textContent = "";
        currentStudyWord = null;
        return;
      }

      const field = studyMode === 'review' ? 'rweight' : 'weight';
      let selectedWord;

      if (nextPlannedWord && pool.includes(nextPlannedWord)) {
        selectedWord = nextPlannedWord;
      } else {
        selectedWord = pickWord(pool, field);
        selectedWord[field] = (selectedWord[field] || 0) + 1;
      }
      nextPlannedWord = null;

      currentStudyWord = selectedWord;
      saveData();
      showStudyWord();

      document.getElementById('studyHint').textContent = previousStudyState ? "상단 터치: 이전 단어 | 화면 터치: 뜻 공개" : "화면을 터치하면 뜻이 공개됩니다";
      isMeaningVisible = false;
    }

    function goPreviousStudyWord() {
      if (!previousStudyState) return;
      const word = vocab.find(v => v.id === previousStudyState.wordId);
      if (!word) { previousStudyState = null; return; }

      nextPlannedWord = currentStudyWord;
      currentStudyWord = word;
      showStudyWord();

      document.getElementById('studyMeaning').classList.add('visible');
      reviewBox.classList.add('visible');
      document.getElementById('studyHint').textContent = "화면을 터치하면 다음 단어로 넘어갑니다";

      isMeaningVisible = true;
      previousStudyState = null;
    }

    chkReview.addEventListener('change', () => {
      if (!currentStudyWord) return;
      currentStudyWord.review = chkReview.checked;
      saveData();
    });

    document.getElementById('studyArea').addEventListener('click', (e) => {
      if (!currentStudyWord) return;

      const rect = e.currentTarget.getBoundingClientRect();
      const clickY = e.clientY - rect.top;

      if (clickY < rect.height * 0.30 && previousStudyState && !isMeaningVisible) {
        goPreviousStudyWord();
        return;
      }

      if (!isMeaningVisible) {
        document.getElementById('studyMeaning').classList.add('visible');
        reviewBox.classList.add('visible');
        document.getElementById('studyHint').textContent = "화면을 터치하면 다음 단어로 넘어갑니다";
        isMeaningVisible = true;
      } else {
        previousStudyState = { wordId: currentStudyWord.id };
        nextStudyWord();
      }
    });

    // --- [섹션 2: 단어 저장 및 공간 관리] ---
    function renderSpaceOptions() {
      const saveSelect = document.getElementById('saveSpaceSelect');
      const editSelect = document.getElementById('editSpaceSelect');
      saveSelect.innerHTML = '';
      editSelect.innerHTML = '';

      [saveSelect, editSelect].forEach(sel => {
        const opt = document.createElement('option');
        opt.value = "";
        opt.textContent = "(비어 있음)";
        sel.appendChild(opt);
      });

      sortSpaceNames(spaces).forEach(sp => {
        [saveSelect, editSelect].forEach(sel => {
          const opt = document.createElement('option');
          opt.value = sp;
          opt.textContent = sp;
          sel.appendChild(opt);
        });
      });
    }

    function toggleBatchAccordion() {
      const content = document.getElementById('batchAccordionContent');
      const open = content.classList.toggle('open');
      document.getElementById('accordionArrow').textContent = open ? 'v' : '>';
    }

    function createNewSpace() {
      const name = document.getElementById('newSpaceName').value.trim();
      if (!name) { alert('공간 이름을 입력해주세요.'); return; }
      if (OLD_REVIEW_NAMES.includes(name) || spaces.includes(name)) {
        alert('사용할 수 없거나 이미 존재하는 공간 이름입니다.');
        return;
      }
      spaces.push(name);
      saveData();
      document.getElementById('newSpaceName').value = '';
      renderSpaceOptions();
      alert(`'${name}' 공간이 생성되었습니다.`);
    }

    function renameSpace() {
      const oldName = document.getElementById('editSpaceSelect').value;
      const newName = document.getElementById('renameSpaceName').value.trim();

      if (!oldName) { alert('편집할 공간을 선택해주세요'); return; }
      if (!newName) { alert('바꿀 이름을 입력해주세요.'); return; }
      if (OLD_REVIEW_NAMES.includes(newName) || spaces.includes(newName)) {
        alert('사용할 수 없거나 이미 존재하는 공간 이름입니다.');
        return;
      }

      if (confirm(`${oldName} -> ${newName} 변경 하시겠습니까?`)) {
        const idx = spaces.indexOf(oldName);
        if (idx !== -1) {
          spaces[idx] = newName;
          vocab.forEach(v => { if (v.space === oldName) v.space = newName; });
          saveData();
          document.getElementById('renameSpaceName').value = '';
          renderSpaceOptions();
          alert('수정되었습니다.');
        }
      }
    }

    function deleteSpace() {
      const targetSpace = document.getElementById('editSpaceSelect').value;
      if (!targetSpace) { alert('편집할 공간을 선택해주세요'); return; }

      if (confirm(`${targetSpace} 삭제하시겠습니까?`)) {
        spaces = spaces.filter(s => s !== targetSpace);
        vocab = vocab.filter(v => v.space !== targetSpace);
        saveData();
        renderSpaceOptions();
        alert('삭제되었습니다.');
      }
    }

    function newWord(eng, kor, space) {
      return { id: Date.now() + Math.random(), eng, kor, space, weight: 0, rweight: 0, review: false };
    }

    function addSingleWord() {
      const space = document.getElementById('saveSpaceSelect').value;
      const eng = document.getElementById('inputEng').value.trim();
      const kor = document.getElementById('inputKor').value.trim();

      if (!space) { alert('저장할 공간을 선택해주세요'); return; }
      if (!eng || !kor) { alert('영단어와 뜻을 모두 입력해주세요.'); return; }

      vocab.push(newWord(eng, kor, space));
      saveData();
      document.getElementById('inputEng').value = '';
      document.getElementById('inputKor').value = '';
      alert('단어가 저장되었습니다.');
    }

    function addBatchWords() {
      const space = document.getElementById('saveSpaceSelect').value;
      const text = document.getElementById('inputBatch').value.trim();

      if (!space) { alert('저장할 공간을 선택해주세요'); return; }
      if (!text) { alert('단어 내용을 입력해주세요.'); return; }

      let count = 0;
      text.split('\n').forEach(line => {
        const parts = line.split(':');
        if (parts.length >= 2) {
          const eng = parts[0].trim();
          const kor = parts.slice(1).join(':').trim();
          if (eng && kor) { vocab.push(newWord(eng, kor, space)); count++; }
        }
      });

      if (count > 0) {
        saveData();
        document.getElementById('inputBatch').value = '';
        alert(`${count}개의 단어가 성공적으로 저장되었습니다.`);
      } else {
        alert('올바른 형식(영단어:뜻)으로 입력해주세요.');
      }
    }

    // --- [섹션 3: 저장 단어 확인 / 복습 폴더 / 중복 폴더] ---
    const byEng = (a, b) => a.eng.localeCompare(b.eng, 'en', { sensitivity: 'base' });

    // 중복 그룹: 영단어(대소문자·앞뒤 공백 무시)가 같은 단어들. 뜻이 가장 긴 1개만 남김(동률이면 먼저 저장된 것)
    function getDuplicateGroups() {
      const map = new Map();
      vocab.forEach(v => {
        const key = v.eng.trim().toLowerCase();
        if (!map.has(key)) map.set(key, []);
        map.get(key).push(v);
      });
      const groups = [];
      map.forEach(items => {
        if (items.length < 2) return;
        let keep = items[0];
        items.forEach(it => { if (it.kor.length > keep.kor.length) keep = it; });
        groups.push({ keep, remove: items.filter(it => it !== keep) });
      });
      return groups;
    }

    function makeFolderCard(title, count, onclick) {
      const div = document.createElement('div');
      div.className = 'folder-card';
      div.onclick = onclick;
      div.innerHTML = `<div class="folder-card-title">${title}</div><div class="folder-card-count">${count}개</div>`;
      return div;
    }

    function renderList() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      const vocabList = document.getElementById('vocabList');
      vocabList.innerHTML = '';

      vocabList.appendChild(makeFolderCard('📁 복습이 필요한 단어', vocab.filter(v => v.review).length, openReviewModal));
      const dupCount = getDuplicateGroups().reduce((n, g) => n + g.remove.length, 0);
      vocabList.appendChild(makeFolderCard('📁 중복 단어 (삭제 대상)', dupCount, openDupModal));

      const filtered = [...vocab].sort(byEng).filter(item =>
        item.eng.toLowerCase().includes(query) ||
        item.kor.toLowerCase().includes(query) ||
        item.space.toLowerCase().includes(query)
      );

      if (filtered.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty-msg';
        empty.textContent = query ? '검색 결과가 없습니다.' : '등록된 단어가 없습니다.';
        vocabList.appendChild(empty);
        return;
      }

      filtered.forEach(item => {
        const div = document.createElement('div');
        div.className = 'word-item';
        div.onclick = () => openModal(item.id);
        div.innerHTML = `
          <div class="word-item-info">
            <div class="word-item-eng">${escapeHtml(item.eng)}</div>
            <div class="word-item-kor">${escapeHtml(item.kor)}</div>
          </div>
          <div class="word-item-meta">
            ${item.review ? '<div class="word-review-badge">🔖 복습</div>' : ''}
            <div class="word-space-badge">${escapeHtml(item.space)}</div>
          </div>
        `;
        vocabList.appendChild(div);
      });
    }

    function openReviewModal() {
      const modalList = document.getElementById('reviewModalList');
      modalList.innerHTML = '';
      const words = vocab.filter(v => v.review).sort(byEng);

      if (words.length === 0) {
        modalList.innerHTML = `<div class="empty-msg">복습이 필요한 단어가 없습니다.</div>`;
      } else {
        words.forEach(item => {
          const div = document.createElement('div');
          div.className = 'word-item';
          div.onclick = () => { closeReviewModal(); openModal(item.id); };
          div.innerHTML = `
            <div class="word-item-info">
              <div class="word-item-eng">${escapeHtml(item.eng)}</div>
              <div class="word-item-kor">${escapeHtml(item.kor)}</div>
            </div>
            <div class="word-item-meta"><div class="word-space-badge">${escapeHtml(item.space)}</div></div>
          `;
          modalList.appendChild(div);
        });
      }
      document.getElementById('reviewListModal').classList.add('active');
    }

    function closeReviewModal() {
      document.getElementById('reviewListModal').classList.remove('active');
    }

    function openDupModal() {
      const list = document.getElementById('dupModalList');
      list.innerHTML = '';
      const groups = getDuplicateGroups().sort((a, b) => byEng(a.keep, b.keep));

      document.getElementById('btnDeleteDup').disabled = groups.length === 0;

      if (groups.length === 0) {
        list.innerHTML = `<div class="empty-msg">중복된 단어가 없습니다.</div>`;
      } else {
        groups.forEach(g => {
          const box = document.createElement('div');
          box.className = 'dup-group';
          const row = (it, keep) => `
            <div class="dup-row ${keep ? 'dup-keep' : 'dup-remove'}">
              <span>${escapeHtml(it.kor)} <small>(${escapeHtml(it.space)})</small></span>
              <b>${keep ? '남김' : '삭제'}</b>
            </div>`;
          box.innerHTML = `<div class="word-item-eng">${escapeHtml(g.keep.eng)}</div>` +
            row(g.keep, true) + g.remove.map(it => row(it, false)).join('');
          list.appendChild(box);
        });
      }
      document.getElementById('dupListModal').classList.add('active');
    }

    function closeDupModal() {
      document.getElementById('dupListModal').classList.remove('active');
    }

    function deleteDuplicates() {
      const groups = getDuplicateGroups();
      const total = groups.reduce((n, g) => n + g.remove.length, 0);
      if (total === 0) return;

      if (confirm(`중복 단어 ${total}개를 삭제하고, 각 단어마다 뜻이 가장 긴 1개만 남깁니다.\n계속하시겠습니까?`)) {
        const removeSet = new Set();
        groups.forEach(g => {
          // 삭제되는 단어 중 복습 표시가 있었다면 남는 단어로 이어줌
          if (g.remove.some(it => it.review)) g.keep.review = true;
          g.remove.forEach(it => removeSet.add(it));
        });
        vocab = vocab.filter(v => !removeSet.has(v));
        saveData();
        renderList();
        closeDupModal();
        alert(`${total}개의 중복 단어가 삭제되었습니다.`);
      }
    }

    function escapeHtml(str) {
      return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function openModal(id) {
      editingId = id;
      const item = vocab.find(v => v.id === id);
      if (!item) return;

      document.getElementById('editEng').value = item.eng;
      document.getElementById('editKor').value = item.kor;

      const spaceSelect = document.getElementById('editWordSpaceSelect');
      spaceSelect.innerHTML = '';
      sortSpaceNames(spaces).forEach(sp => {
        const opt = document.createElement('option');
        opt.value = sp;
        opt.textContent = sp;
        if (sp === item.space) opt.selected = true;
        spaceSelect.appendChild(opt);
      });

      document.getElementById('editModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('editModal').classList.remove('active');
      editingId = null;
    }

    function saveEditWord() {
      const eng = document.getElementById('editEng').value.trim();
      const kor = document.getElementById('editKor').value.trim();
      const space = document.getElementById('editWordSpaceSelect').value;

      if (!eng || !kor) { alert('영단어와 뜻을 모두 입력해주세요.'); return; }

      const item = vocab.find(v => v.id === editingId);
      if (item) {
        item.eng = eng;
        item.kor = kor;
        item.space = space;
        saveData();
        renderList();
        closeModal();
      }
    }

    function deleteCurrentWord() {
      if (confirm('이 단어를 삭제하시겠습니까?')) {
        vocab = vocab.filter(v => v.id !== editingId);
        saveData();
        renderList();
        closeModal();
      }
    }

    init();
  </script>
</body>
</html>
