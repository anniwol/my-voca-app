<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>단어장 앱</title>
  <style>
    :root {
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --text-color: #212529;
      --text-sub: #6c757d;
      --accent-color: #0d6efd;
      --border-color: #e9ecef;
      --input-bg: #ffffff;
      --shadow-color: rgba(0, 0, 0, 0.05);
    }

    [data-theme="dark"] {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-color: #f8f9fa;
      --text-sub: #adb5bd;
      --accent-color: #3d8bfd;
      --border-color: #2c2c2c;
      --input-bg: #2a2a2a;
      --shadow-color: rgba(0, 0, 0, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* 상단 네비게이션 헤더 */
    .app-header {
      height: 56px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
      background-color: var(--bg-color);
      z-index: 100;
      flex-shrink: 0;
    }

    .header-btn {
      background: none;
      border: none;
      color: var(--text-color);
      font-size: 1.2rem;
      cursor: pointer;
      padding: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .header-title {
      font-size: 1.1rem;
      font-weight: 600;
    }

    /* 테마 스위치 */
    .theme-toggle {
      display: flex;
      align-items: center;
      cursor: pointer;
    }

    .theme-toggle input {
      display: none;
    }

    .toggle-slider {
      width: 44px;
      height: 24px;
      background-color: #ccc;
      border-radius: 12px;
      position: relative;
      transition: 0.3s;
    }

    .toggle-slider::before {
      content: "";
      position: absolute;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background-color: white;
      top: 3px;
      left: 3px;
      transition: 0.3s;
    }

    input:checked + .toggle-slider {
      background-color: var(--accent-color);
    }

    input:checked + .toggle-slider::before {
      transform: translateX(20px);
    }

    /* 메인 컨테이너 */
    .content-area {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    .section {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
      flex-direction: column;
    }

    .section.active {
      display: flex;
    }

    /* [메인 홈 섹션] */
    .home-container {
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 500px;
      margin: 0 auto;
      width: 100%;
      height: 100%;
      justify-content: center;
    }

    .menu-card {
      background-color: var(--card-bg);
      padding: 24px 20px;
      border-radius: 16px;
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 12px var(--shadow-color);
      cursor: pointer;
      transition: transform 0.1s, border-color 0.2s;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .menu-card:active {
      transform: scale(0.98);
    }

    .menu-card h2 {
      font-size: 1.25rem;
      color: var(--accent-color);
    }

    .menu-card p {
      font-size: 0.9rem;
      color: var(--text-sub);
    }

    /* [섹션 1: 랜덤 단어 학습] - 카드 테두리 및 그림자 없는 초기 깔끔한 스타일 */
    .study-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 30px 20px;
      text-align: center;
      cursor: pointer;
    }

    .word-display {
      font-size: 2.8rem;
      font-weight: 700;
      margin-bottom: 24px;
      word-break: break-word;
      color: var(--text-color);
    }

    .meaning-display {
      font-size: 1.8rem;
      color: var(--accent-color);
      min-height: 2.4rem;
      visibility: hidden;
      word-break: break-word;
      font-weight: 500;
    }

    .meaning-display.visible {
      visibility: visible;
    }

    .study-hint {
      position: absolute;
      bottom: 40px;
      font-size: 0.9rem;
      color: var(--text-sub);
    }

    /* [섹션 2: 단어 저장 및 편집] */
    .add-container {
      padding: 20px 16px;
      overflow-y: auto;
      max-width: 500px;
      margin: 0 auto;
      width: 100%;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text-sub);
    }

    .form-input, .form-textarea {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background-color: var(--input-bg);
      color: var(--text-color);
      font-size: 1rem;
      outline: none;
      user-select: text;
    }

    .form-textarea {
      height: 120px;
      resize: none;
    }

    .btn-primary {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: none;
      background-color: var(--accent-color);
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }

    .divider {
      text-align: center;
      margin: 24px 0;
      position: relative;
    }

    .divider::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 0;
      width: 100%;
      height: 1px;
      background-color: var(--border-color);
      z-index: 1;
    }

    .divider span {
      position: relative;
      z-index: 2;
      background-color: var(--bg-color);
      padding: 0 12px;
      font-size: 0.85rem;
      color: var(--text-sub);
    }

    /* [섹션 3: 단어 목록 및 검색] - 검색창 구역 완전 독립 분리 */
    .list-header-area {
      padding: 12px 16px;
      background-color: var(--bg-color);
      border-bottom: 1px solid var(--border-color);
      flex-shrink: 0;
    }

    .search-input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background-color: var(--input-bg);
      color: var(--text-color);
      font-size: 1rem;
      outline: none;
      user-select: text;
    }

    .word-list-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }

    .list-container {
      max-width: 500px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-bottom: 40px;
    }

    .word-item {
      background-color: var(--card-bg);
      padding: 16px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }

    .word-item-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      user-select: text;
    }

    .word-item-eng {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .word-item-kor {
      font-size: 0.95rem;
      color: var(--text-sub);
    }

    .empty-msg {
      text-align: center;
      color: var(--text-sub);
      padding: 40px 0;
      font-size: 0.95rem;
    }

    /* 모달 */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 200;
      padding: 20px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-box {
      background-color: var(--card-bg);
      border-radius: 16px;
      width: 100%;
      max-width: 400px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .modal-title {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .modal-btns {
      display: flex;
      gap: 8px;
    }

    .btn-secondary {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: none;
      color: var(--text-color);
      font-weight: 600;
      cursor: pointer;
    }

    .btn-danger {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: none;
      background-color: #dc3545;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- 글로벌 상단 헤더 -->
  <header class="app-header">
    <button class="header-btn" id="backBtn" style="visibility: hidden;">&#x2190;</button>
    <div class="header-title" id="headerTitle">단어장</div>
    <label class="theme-toggle">
      <input type="checkbox" id="themeSwitch">
      <span class="toggle-slider"></span>
    </label>
  </header>

  <!-- 콘텐츠 구역 -->
  <main class="content-area">

    <!-- [홈 섹션] -->
    <section id="sec-home" class="section active">
      <div class="home-container">
        <div class="menu-card" onclick="navTo('study')">
          <h2>1. 랜덤 단어 학습</h2>
          <p>저장된 단어를 랜덤으로 띄우고 터치하여 학습합니다.</p>
        </div>
        <div class="menu-card" onclick="navTo('add')">
          <h2>2. 단어 추가 및 입력</h2>
          <p>새 단어를 개별 또는 일괄로 입력하여 저장합니다.</p>
        </div>
        <div class="menu-card" onclick="navTo('list')">
          <h2>3. 단어 목록 및 편집</h2>
          <p>알파벳순 목록 검색, 단어 수정 및 삭제를 관리합니다.</p>
        </div>
      </div>
    </section>

    <!-- [섹션 1: 학습] -->
    <section id="sec-study" class="section">
      <div class="study-container" id="studyArea">
        <div class="word-display" id="studyWord">등록된 단어가 없습니다</div>
        <div class="meaning-display" id="studyMeaning">뜻</div>
        <div class="study-hint" id="studyHint">화면을 터치하세요</div>
      </div>
    </section>

    <!-- [섹션 2: 추가] -->
    <section id="sec-add" class="section">
      <div class="add-container">
        <div class="form-group">
          <label>개별 단어 추가</label>
          <input type="text" id="inputEng" class="form-input" placeholder="영단어 (예: apple)" style="margin-bottom: 8px;">
          <input type="text" id="inputKor" class="form-input" placeholder="뜻 (예: 사과)">
        </div>
        <button class="btn-primary" onclick="addSingleWord()">단어 저장하기</button>

        <div class="divider"><span>또는 일괄 입력</span></div>

        <div class="form-group">
          <label>여러 단어 한 번에 추가 (영단어:뜻 줄바꿈)</label>
          <textarea id="inputBatch" class="form-textarea" placeholder="apple:사과&#10;banana:바나나&#10;car:자동차"></textarea>
        </div>
        <button class="btn-primary" onclick="addBatchWords()">일괄 저장하기</button>
      </div>
    </section>

    <!-- [섹션 3: 목록 및 편집] -->
    <section id="sec-list" class="section">
      <!-- 고정 검색창 구역 -->
      <div class="list-header-area">
        <input type="text" id="searchInput" class="search-input" placeholder="단어 또는 뜻 검색..." oninput="renderList()">
      </div>
      <!-- 별도 스크롤 단어 목록 구역 -->
      <div class="word-list-scroll">
        <div class="list-container" id="vocabList"></div>
      </div>
    </section>

  </main>

  <!-- 수정/삭제 모달 -->
  <div class="modal-overlay" id="editModal">
    <div class="modal-box">
      <div class="modal-title">단어 수정</div>
      <input type="text" id="editEng" class="form-input" placeholder="영단어">
      <input type="text" id="editKor" class="form-input" placeholder="뜻">
      <div class="modal-btns">
        <button class="btn-danger" onclick="deleteCurrentWord()">삭제</button>
        <button class="btn-secondary" onclick="closeModal()">취소</button>
        <button class="btn-primary" style="flex: 1;" onclick="saveEditWord()">저장</button>
      </div>
    </div>
  </div>

  <script>
    // 기본 단어 데이터
    const defaultVocab = [
      { id: 1, eng: "apple", kor: "사과" },
      { id: 2, kor: "바나나", eng: "banana" },
      { id: 3, eng: "meticulous", kor: "꼼꼼한, 세심한" },
      { id: 4, eng: "persistent", kor: "끈질긴, 집요한" }
    ];

    let vocab = JSON.parse(localStorage.getItem('my_vocab_db')) || defaultVocab;
    let currentTheme = localStorage.getItem('my_vocab_theme') || 'light';
    
    let currentStudyIndex = -1;
    let isMeaningVisible = false;
    let editingId = null;

    // Element 참조
    const themeSwitch = document.getElementById('themeSwitch');
    const backBtn = document.getElementById('backBtn');
    const headerTitle = document.getElementById('headerTitle');
    
    // 초기화
    function init() {
      // 테마 설정
      if (currentTheme === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
        themeSwitch.checked = true;
      }
      
      saveData();
      renderList();
    }

    function saveData() {
      localStorage.setItem('my_vocab_db', JSON.stringify(vocab));
    }

    // 테마 토글
    themeSwitch.addEventListener('change', (e) => {
      if (e.target.checked) {
        document.documentElement.setAttribute('data-theme', 'dark');
        localStorage.setItem('my_vocab_theme', 'dark');
      } else {
        document.documentElement.removeAttribute('data-theme');
        localStorage.setItem('my_vocab_theme', 'light');
      }
    });

    // 네비게이션
    function navTo(secName) {
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      
      if (secName === 'home') {
        document.getElementById('sec-home').classList.add('active');
        backBtn.style.visibility = 'hidden';
        headerTitle.textContent = '단어장';
      } else {
        document.getElementById(`sec-${secName}`).classList.add('active');
        backBtn.style.visibility = 'visible';
        
        if (secName === 'study') {
          headerTitle.textContent = '랜덤 학습';
          startStudy();
        } else if (secName === 'add') {
          headerTitle.textContent = '단어 추가';
        } else if (secName === 'list') {
          headerTitle.textContent = '단어 목록';
          renderList();
        }
      }
    }

    backBtn.addEventListener('click', () => navTo('home'));

    // --- [섹션 1: 학습] ---
    const studyWord = document.getElementById('studyWord');
    const studyMeaning = document.getElementById('studyMeaning');
    const studyHint = document.getElementById('studyHint');
    const studyArea = document.getElementById('studyArea');

    function startStudy() {
      isMeaningVisible = false;
      if (vocab.length === 0) {
        studyWord.textContent = "저장된 단어가 없습니다";
        studyMeaning.textContent = "";
        studyHint.textContent = "2번 메뉴에서 단어를 추가하세요";
        return;
      }
      nextStudyWord();
    }

    function nextStudyWord() {
      let rand;
      if (vocab.length === 1) {
        rand = 0;
      } else {
        do {
          rand = Math.floor(Math.random() * vocab.length);
        } while (rand === currentStudyIndex);
      }
      
      currentStudyIndex = rand;
      const item = vocab[currentStudyIndex];
      
      studyWord.textContent = item.eng;
      studyMeaning.textContent = item.kor;
      studyMeaning.classList.remove('visible');
      studyHint.textContent = "화면을 터치하면 뜻이 나옵니다";
      isMeaningVisible = false;
    }

    studyArea.addEventListener('click', () => {
      if (vocab.length === 0) return;

      if (!isMeaningVisible) {
        studyMeaning.classList.add('visible');
        studyHint.textContent = "화면을 터치하면 다음 단어로 넘어갑니다";
        isMeaningVisible = true;
      } else {
        nextStudyWord();
      }
    });

    // --- [섹션 2: 단어 추가] ---
    function addSingleWord() {
      const eng = document.getElementById('inputEng').value.trim();
      const kor = document.getElementById('inputKor').value.trim();

      if (!eng || !kor) {
        alert('영단어와 뜻을 모두 입력해주세요.');
        return;
      }

      vocab.push({ id: Date.now(), eng, kor });
      saveData();
      
      document.getElementById('inputEng').value = '';
      document.getElementById('inputKor').value = '';
      alert('단어가 추가되었습니다.');
    }

    function addBatchWords() {
      const text = document.getElementById('inputBatch').value.trim();
      if (!text) {
        alert('단어 내용을 입력해주세요.');
        return;
      }

      const lines = text.split('\n');
      let count = 0;

      lines.forEach(line => {
        const parts = line.split(':');
        if (parts.length >= 2) {
          const eng = parts[0].trim();
          const kor = parts.slice(1).join(':').trim();
          if (eng && kor) {
            vocab.push({ id: Date.now() + Math.random(), eng, kor });
            count++;
          }
        }
      });

      if (count > 0) {
        saveData();
        document.getElementById('inputBatch').value = '';
        alert(`${count}개의 단어가 성공적으로 등록되었습니다.`);
      } else {
        alert('올바른 형식(영단어:뜻)으로 입력해주세요.');
      }
    }

    // --- [섹션 3: 목록 및 편집] ---
    function renderList() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      const vocabList = document.getElementById('vocabList');
      vocabList.innerHTML = '';

      // 알파벳 순 정렬
      const sorted = [...vocab].sort((a, b) => a.eng.localeCompare(b.eng, 'en', { sensitivity: 'base' }));
      
      // 검색 필터링
      const filtered = sorted.filter(item => 
        item.eng.toLowerCase().includes(query) || item.kor.toLowerCase().includes(query)
      );

      if (filtered.length === 0) {
        vocabList.innerHTML = `<div class="empty-msg">${query ? '검색 결과가 없습니다.' : '등록된 단어가 없습니다.'}</div>`;
        return;
      }

      filtered.forEach(item => {
        const div = document.createElement('div');
        div.className = 'word-item';
        div.onclick = () => openModal(item.id);
        div.innerHTML = `
          <div class="word-item-info">
            <div class="word-item-eng">${escapeHtml(item.eng)}</div>
            <div class="word-item-kor">${escapeHtml(item.kor)}</div>
          </div>
        `;
        vocabList.appendChild(div);
      });
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // --- [모달 / 편집 및 삭제] ---
    function openModal(id) {
      editingId = id;
      const item = vocab.find(v => v.id === id);
      if (!item) return;

      document.getElementById('editEng').value = item.eng;
      document.getElementById('editKor').value = item.kor;
      document.getElementById('editModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('editModal').classList.remove('active');
      editingId = null;
    }

    function saveEditWord() {
      const eng = document.getElementById('editEng').value.trim();
      const kor = document.getElementById('editKor').value.trim();

      if (!eng || !kor) {
        alert('영단어와 뜻을 모두 입력해주세요.');
        return;
      }

      const index = vocab.findIndex(v => v.id === editingId);
      if (index !== -1) {
        vocab[index].eng = eng;
        vocab[index].kor = kor;
        saveData();
        renderList();
        closeModal();
      }
    }

    function deleteCurrentWord() {
      if (confirm('이 단어를 삭제하시겠습니까?')) {
        vocab = vocab.filter(v => v.id !== editingId);
        saveData();
        renderList();
        closeModal();
      }
    }

    // 앱 시작
    init();
  </script>
</body>
</html>
